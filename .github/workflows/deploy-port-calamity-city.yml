# Deploys the PORT CALAMITY game message service. Kept here because this repository holds the
# Cloudflare secrets. Source: the draft in the game repository, server/deploy/. It deploys Worker
# "port-calamity-city" from the game repository's server/ folder and touches nothing of Awana.
#
# - Manual only (workflow_dispatch): it never runs on a push, so this repository's own deploys are
#   unaffected.
# - It reads two existing secrets, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. They are passed
#   to wrangler as environment variables of ONE step and never echoed. Do not add `set -x`, `env`,
#   or debug printing to that step.
# - The API token needs "Workers Scripts: Edit" on the account (the token that already deploys a
#   Worker with a Durable Object from this repository should do).
# - If the game repository is private, add a read-only token for it as a secret and pass it to the
#   checkout step as `token:`; a public repository needs nothing.

name: Deploy port-calamity-city

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of the game repository to deploy
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-port-calamity-city
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the game repository
        uses: actions/checkout@v4
        with:
          repository: patrick-simpson/GTA-Claude-4.8-Opus
          ref: ${{ inputs.ref }}
          path: game
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/server/package-lock.json

      - name: Install the service's own dependencies
        working-directory: game/server
        run: npm ci

      - name: Type check
        working-directory: game/server
        run: npm run typecheck

      - name: Deploy
        working-directory: game/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx wrangler deploy
