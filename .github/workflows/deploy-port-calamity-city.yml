# Deploys the PORT CALAMITY game message service. Kept here as a by-hand job; it
# uses its OWN Cloudflare secrets (below). Source: the draft in the game repository, server/deploy/. It deploys Worker
# "port-calamity-city" from the game repository's server/ folder, with its own Cloudflare token.
#
# - Manual only (workflow_dispatch): it never runs on a push, so this repository's own deploys are
#   unaffected.
# - It NEVER uses Awana's CLOUDFLARE_API_TOKEN (owner 2026-11-25, weekly review IP-20261125-02):
#   the game's code and its npm packages run in this job, and Awana's token could deploy over the
#   sync Worker. It reads its own secrets, CALAMITY_CLOUDFLARE_API_TOKEN and
#   CALAMITY_CLOUDFLARE_ACCOUNT_ID, and stops if either is missing. Make that token in Cloudflare
#   (My Profile, API Tokens) with "Workers Scripts: Edit" and, best, on a SEPARATE free Cloudflare
#   account, so the game's requests never count against Awana's 100,000 a day. They are passed to
#   wrangler as environment variables of ONE step and never echoed. Do not add `set -x`, `env`,
#   or debug printing to that step.
# - If the game repository is private, add a read-only token for it as a secret and pass it to the
#   checkout step as `token:`; a public repository needs nothing.

name: Deploy port-calamity-city

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of the game repository to deploy
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-port-calamity-city
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The game's own Cloudflare token is set
        env:
          TOKEN: ${{ secrets.CALAMITY_CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CALAMITY_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Add the secrets CALAMITY_CLOUDFLARE_API_TOKEN and CALAMITY_CLOUDFLARE_ACCOUNT_ID (see this file's header). Awana's own Cloudflare token is never used here."
            exit 1
          fi
      - name: Check out the game repository
        uses: actions/checkout@v4
        with:
          repository: patrick-simpson/GTA-Claude-4.8-Opus
          ref: ${{ inputs.ref }}
          path: game
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/server/package-lock.json

      - name: Install the service's own dependencies
        working-directory: game/server
        run: npm ci

      - name: Type check
        working-directory: game/server
        run: npm run typecheck

      - name: Deploy
        working-directory: game/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CALAMITY_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CALAMITY_CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx wrangler deploy
