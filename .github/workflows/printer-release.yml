name: Release KVBC Awana

# One workflow cuts a printer release end to end. Since 9.0.0 the app is
# "KVBC Awana" (UNIFIED-APP.md): build.productName names the installer
# (KVBC-Awana-Setup.exe), the exe and the process ("KVBC Awana"); the
# package "name" (awana-label-printer), the appId and so the install folder
# (%LOCALAPPDATA%\Programs\awana-label-printer) and userData are unchanged,
# which is how the check-in laptop upgrades in place from this feed.
# Run it from the Actions tab
# (or `gh workflow run printer-release.yml -f version=6.22.0`), with the
# version in printer/VERSION and printer/electron-app/package.json, no "v".
#
# It replaces the old repo's two workflows (create-release-tag.yml, which
# pushed the tag and then dispatched build-electron.yml against it, because a
# tag pushed by GITHUB_TOKEN fires no push trigger). Tag and build are jobs of
# this one run now, chained with `needs`, so that dispatch -- and the
# tag-only guards that existed because the build could also be started by
# hand without a tag -- are gone. The tag is `printer-vX.Y.Z`: the monorepo
# has several apps and only this one owns the `printer-` prefix.
#
# Update feed: installed printers read
# https://awana.kvbchurch.org/updates/printer/latest.yml (electron-updater's
# generic provider), NOT this repo's "Latest" release, which the printer and
# the sound room app can no longer share. The installer and blockmap stay
# release assets; the last job rewrites latest.yml to point at them by
# absolute URL, commits it to site/updates/printer/ and dispatches ci.yml so
# the site redeploys with it. Releases are therefore published with
# make_latest: false. To undo a bad release, run printer-delete-release.yml
# AND revert site/updates/printer/latest.yml.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 5.0.2 (no leading "v" and no "printer-v" prefix, both added automatically)'
        required: true
      ref:
        description: 'Branch or commit to tag'
        required: false
        default: 'main'

permissions:
  contents: write   # create the tag and the release, commit the feed
  actions: write    # dispatch ci.yml so the site redeploys with the new feed

concurrency:
  group: printer-release
  cancel-in-progress: false

jobs:
  # The tests run FIRST, and the tag is created only once they pass. The tag
  # used to be pushed before anything ran, so a failing test or build left a
  # tag behind and the retry died on "already exists".
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js and install root dependencies
        uses: ./.github/actions/setup-app
        with:
          lockfile: |
            printer/package-lock.json
            printer/print-server/package-lock.json
          working-directory: printer
      - name: Install print-server dependencies
        run: npm ci
        working-directory: printer/print-server
      - name: Run the test suites
        run: npm test
        working-directory: printer

  tag:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.sha }}
          fetch-depth: 0

      - name: Validate version and create tag
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be X.Y.Z with no leading 'v' (got: '$VERSION')"
            exit 1
          fi
          TAG="printer-v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists — bump to a new version instead of reusing one"
            exit 1
          fi
          # Guard against releasing a build that doesn't match its own version
          # bump (printer/VERSION is the single source of truth, kept in sync
          # by printer/scripts/bump-version.cjs across the app).
          REPO_VERSION="$(tr -d '[:space:]' < printer/VERSION)"
          if [ "$REPO_VERSION" != "$VERSION" ]; then
            echo "::error::printer/VERSION says $REPO_VERSION but you asked to release $VERSION — run printer/scripts/bump-version.cjs first"
            exit 1
          fi
          PKG_VERSION="$(node -p "require('./printer/electron-app/package.json').version")"
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::printer/electron-app/package.json says $PKG_VERSION but you asked to release $VERSION"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "### Created tag \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

  # (The test suites are the first job above: pure Node, on Ubuntu on
  # purpose, since the security suite binds 0.0.0.0 and connects back over a
  # non-loopback address, which is simpler without the Windows firewall.)

  build:
    needs: [tag, test]
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.sha }}

      - uses: ./.github/actions/setup-app
        with:
          lockfile: printer/electron-app/package-lock.json

      # The full print server ships inside the installer via extraResources,
      # INCLUDING its node_modules — without this install step the packaged
      # app has no server dependencies at all. @napi-rs/canvas ships prebuilt
      # N-API binaries, so this needs no build toolchain and the same modules
      # load in both plain Node and Electron.
      - name: Install print-server dependencies
        run: npm ci --omit=dev
        working-directory: printer/print-server

      - name: Render smoke test (label pipeline works headless)
        run: node scripts/render-smoke.cjs render-smoke-out
        working-directory: printer

      - name: Upload rendered label samples
        uses: actions/upload-artifact@v4
        with:
          name: label-render-samples
          path: printer/render-smoke-out/*.png
          if-no-files-found: error
          # Only passed between this run's jobs (build, smoke test, release); the
          # installers people download live on the Release. Kept a day, not
          # GitHub's default 90, which filled the account's 0.5 GB of Actions
          # storage with old installers (owner, 2026-10-11).
          retention-days: 1

      - name: Install electron-app dependencies
        run: npm ci
        working-directory: printer/electron-app

      # Build only — publishing happens in the release job AFTER the installed
      # exe passes the smoke test, so a broken build can never reach users.
      - name: Build installer
        run: npm run dist
        working-directory: printer/electron-app

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KVBC-Awana-Setup
          path: |
            printer/electron-app/dist/*.exe
            printer/electron-app/dist/*.blockmap
            printer/electron-app/dist/latest.yml
          if-no-files-found: error
          # Only passed between this run's jobs (build, smoke test, release); the
          # installers people download live on the Release. Kept a day, not
          # GitHub's default 90, which filled the account's 0.5 GB of Actions
          # storage with old installers (owner, 2026-10-11).
          retention-days: 1

  smoke-test:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: KVBC-Awana-Setup
          path: installer

      - name: Install silently
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer -Filter *.exe | Select-Object -First 1
          # Which machine this is: the start-up crash below has been seen on
          # some runners and not others with the same image, so the processor
          # is the next suspect. Logged, not acted on.
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfLogicalProcessors | Format-List | Out-String | Write-Host
          Write-Host "Installer: $($exe.Name) $($exe.Length) bytes, SHA256 $((Get-FileHash $exe.FullName).Hash)"
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList '/S' -PassThru -Wait
          Write-Host "Installer process exit code: $($proc.ExitCode)"
          # 0xC0000005 (access violation) within seconds of starting, before a
          # single file is copied: seen on the hosted runner for 7.3.0 and 7.6.0
          # while the same installer built from near-identical code installed
          # cleanly for 7.4.0-7.5.0, so it is the runner, not the installer
          # (an installer bug crashes every time). Retry that one exit code ONCE,
          # out loud; a second crash, or any other failure, still fails here.
          if ($proc.ExitCode -eq -1073741819) {
            Write-Host "::warning::Installer crashed at start (0xC0000005); retrying once"
            Start-Sleep -Seconds 5
            $proc = Start-Process -FilePath $exe.FullName -ArgumentList '/S' -PassThru -Wait
            Write-Host "Installer process exit code (retry): $($proc.ExitCode)"
          }

          # electron-builder's one-click NSIS installer is a self-extracting
          # stub that can hand off the real file copy to a detached child and
          # return before that child finishes — a single Test-Path right after
          # -Wait returns is a race (reproduced on two different runners).
          # Poll for the app instead of assuming the exact path.
          $deadline = (Get-Date).AddSeconds(60)
          $installed = $null
          while ((Get-Date) -lt $deadline) {
            $found = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Filter 'KVBC Awana.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $installed = $found.FullName; break }
            Start-Sleep -Seconds 3
          }

          if (-not $installed) {
            Write-Host "---- Diagnostics: $env:LOCALAPPDATA\Programs ----"
            Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName | Format-Table -AutoSize | Out-String | Write-Host
            Write-Host "---- Diagnostics: uninstall registry entries ----"
            Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like '*KVBC Awana*' -or $_.DisplayName -like '*Label Printer*' } | Format-List | Out-String | Write-Host
            throw "App exe never appeared under `$env:LOCALAPPDATA\Programs after 60s (installer exit code: $($proc.ExitCode))"
          }

          Write-Host "Installed app found at: $installed"
          # The renamed app (9.0.0) must land in the SAME folder as every 8.x
          # install: the folder comes from package.json's "name", and a new
          # one would leave the check-in laptop with two copies.
          if ($installed -notlike "*\Programs\awana-label-printer\KVBC Awana.exe") {
            throw "Installed to an unexpected folder: $installed (expected %LOCALAPPDATA%\Programs\awana-label-printer)"
          }
          if ($exe.Name -ne 'KVBC-Awana-Setup.exe') { throw "Unexpected installer name: $($exe.Name)" }
          "INSTALLED_EXE=$installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Pre-seed config so the app starts the server instead of waiting in the
      # first-run wizard. launchOnBoot off so the runner image stays clean.
      #
      # --user-data-dir pins Electron's userData folder explicitly instead of
      # guessing where app.getPath('userData') lands: the install step above
      # just proved the install directory uses package.json's "name" field
      # (awana-label-printer — deliberately NOT renamed in the v5.9.0 "Club
      # Label Printer" rebrand or the 9.0.0 "KVBC Awana" one, see changes.md),
      # not "productName" (now "KVBC Awana") as assumed — guessing the config/userData path
      # the same way is the same class of bug. --user-data-dir is a native
      # Electron/Chromium switch
      # that app.getPath('userData') honors automatically, so this sidesteps
      # the guess entirely. Stdout/stderr are captured so a future failure is
      # diagnosable from logs instead of another blind guess.
      - name: Seed config and launch
        shell: pwsh
        run: |
          $ciDataDir = "$env:RUNNER_TEMP\awana-userdata"
          New-Item -ItemType Directory -Force -Path $ciDataDir | Out-Null
          @{ printerName = 'Microsoft Print to PDF'; checkinUrl = 'https://example.com/'; launchOnBoot = $false } |
            ConvertTo-Json | Set-Content "$ciDataDir\config.json"
          "CI_DATA_DIR=$ciDataDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $launchTime = Get-Date
          "APP_LAUNCH_TIME=$($launchTime.ToString('o'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Launch through cmd's OS-level file redirection, NOT PowerShell's
          # -RedirectStandardOutput/-RedirectStandardError: those couple the
          # app's stdout/stderr pipes to this step's pwsh process, so when the
          # step exits moments later the pipes break and the app's next
          # console write gets EPIPE — which kills a Node/Electron process
          # (its uncaughtException handler writes to the equally-dead stderr).
          # That matches the observed failure exactly: everything logged in
          # the first seconds was captured, then the process silently
          # vanished after this step ended. cmd hands the child real file
          # handles that outlive everything.
          $cmdProc = Start-Process cmd.exe `
            -ArgumentList "/c", "`"`"$env:INSTALLED_EXE`" --auto-start --user-data-dir=`"$ciDataDir`" 1>`"$ciDataDir\stdout.log`" 2>`"$ciDataDir\stderr.log`"`"" `
            -PassThru
          # Resolve the actual app PID (cmd is just the launcher wrapper).
          $appProc = $null
          $findDeadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $findDeadline) {
            $appProc = Get-Process 'KVBC Awana' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($appProc) { break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $appProc) { throw "App process never appeared after launch (cmd wrapper PID $($cmdProc.Id), exited: $($cmdProc.HasExited))" }
          "APP_PID=$($appProc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Launched app PID $($appProc.Id) (via cmd wrapper $($cmdProc.Id))"

      - name: Verify FULL server is up and serving
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # Sample the process's liveness on every poll instead of only
          # checking once at the end — a v5.0.2 run showed the server start
          # and bind the port successfully, then the process was gone by the
          # time of a single end-of-window check, with no way to tell when or
          # why it died. This pinpoints the moment instead of guessing.
          $deadline = (Get-Date).AddSeconds(90)
          $health = $null
          $diedAt = $null
          while ((Get-Date) -lt $deadline) {
            $alive = Get-Process -Id $env:APP_PID -ErrorAction SilentlyContinue
            if (-not $alive -and -not $diedAt) {
              $diedAt = Get-Date
              $elapsed = [math]::Round(($diedAt - [datetime]$env:APP_LAUNCH_TIME).TotalSeconds, 1)
              Write-Host "!! App process (PID $env:APP_PID) is no longer running — died ~${elapsed}s after launch"
            }
            try { $health = Invoke-RestMethod http://localhost:3456/health -TimeoutSec 3; break } catch { Start-Sleep 2 }
          }
          if (-not $health) {
            Write-Host "---- Diagnostics: app stdout ----"
            Get-Content "$env:CI_DATA_DIR\stdout.log" -ErrorAction SilentlyContinue | Write-Host
            Write-Host "---- Diagnostics: app stderr ----"
            Get-Content "$env:CI_DATA_DIR\stderr.log" -ErrorAction SilentlyContinue | Write-Host
            Write-Host "---- Diagnostics: process liveness ----"
            if ($diedAt) {
              Write-Host "Process died at $diedAt (~$([math]::Round(($diedAt - [datetime]$env:APP_LAUNCH_TIME).TotalSeconds,1))s after launch); no /health response before or after."
            } else {
              Write-Host "Process (PID $env:APP_PID) was still running at timeout — server bound but never answered /health, or answered on a different interface."
              Get-Process -Id $env:APP_PID -ErrorAction SilentlyContinue | Format-List | Out-String | Write-Host
            }
            Write-Host "---- Diagnostics: is anything listening on port 3456? ----"
            Get-NetTCPConnection -LocalPort 3456 -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Write-Host
            Write-Host "---- Diagnostics: Windows Application event log (crash reports) ----"
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = [datetime]$env:APP_LAUNCH_TIME } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -like '*KVBC Awana*' -or $_.ProviderName -like '*Application Error*' } |
              Select-Object TimeCreated, Id, ProviderName, @{n='Message';e={$_.Message.Substring(0, [Math]::Min(500, $_.Message.Length))}} |
              Format-List | Out-String | Write-Host
            throw 'Server never answered /health'
          }
          Write-Host "Health: $($health | ConvertTo-Json -Compress)"
          if ($health.status -ne 'ok') { throw "Unexpected health status: $($health.status)" }

          # Version must match the version being released (guards a stale
          # build). This workflow always releases, so there is no tag-less
          # case to skip any more.
          $expected = "$env:RELEASE_VERSION"
          if ($health.version -ne $expected) { throw "Version mismatch: server=$($health.version) release=$expected" }

          # The label brand kit (print-server/public/brand, shipped by
          # extraResources' public/** filter) must have made it into the
          # installed app. A label still prints without it (every piece falls
          # back), which is exactly why a packaging slip would otherwise go
          # unnoticed until someone looks at a label: fail the release here.
          if (-not $health.fonts -or $health.fonts.failed.Count -ne 0 -or $health.fonts.loaded.Count -lt 4) {
            throw "Label fonts did not load in the installed app: $($health.fonts | ConvertTo-Json -Compress)"
          }
          if (-not $health.clubMarks -or $health.clubMarks.failed.Count -ne 0 -or $health.clubMarks.loaded.Count -lt 6) {
            throw "Club marks did not load in the installed app: $($health.clubMarks | ConvertTo-Json -Compress)"
          }

          # /preview only exists on the FULL server — this is the check that
          # the packaged server (and its canvas renderer) actually loaded
          # instead of anything degraded. It must return a real PNG.
          $png = Invoke-WebRequest 'http://localhost:3456/preview?firstName=Smoke&lastName=Test' -TimeoutSec 15
          if ($png.StatusCode -ne 200) { throw "/preview returned $($png.StatusCode)" }
          $bytes = $png.Content
          if ($bytes[0] -ne 0x89 -or $bytes[1] -ne 0x50) { throw '/preview did not return a PNG — full server render path broken' }
          Write-Host "Preview PNG: $($bytes.Length) bytes"

          # KVBC Awana's roles (9.0.0): the seeded config.json is printer data,
          # so this start must have decided "print server, display off, setup
          # done" (the check-in laptop's upgrade path) and written roles.json.
          $roles = Get-Content "$env:CI_DATA_DIR\roles.json" -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
          if (-not $roles -or $roles.print -ne $true -or $roles.display -ne $false -or $roles.setupDone -ne $true) {
            throw "roles.json is not the upgraded laptop's (print server, display off, setup done): $($roles | ConvertTo-Json -Compress)"
          }
          Write-Host "Roles: $($roles | ConvertTo-Json -Compress)"

      - name: Stop app
        if: always()
        shell: pwsh
        run: Get-Process 'KVBC Awana' -ErrorAction SilentlyContinue | Stop-Process -Force

  release:
    # Publish only after the INSTALLED app passed the smoke test.
    needs: [tag, smoke-test]
    runs-on: ubuntu-latest
    # The "wait for the live feed" step alone allows 30 minutes.
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      # main, not the tag: the feed is committed to main.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: KVBC-Awana-Setup
          path: installer

      # latest.yml + blockmap are the electron-updater feed inputs. Not
      # "Latest": the printer reads site/updates/printer/latest.yml instead.
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: printer-v${{ inputs.version }}
          name: KVBC Awana ${{ inputs.version }}
          make_latest: 'false'
          files: |
            installer/*.exe
            installer/*.blockmap
            installer/latest.yml

      # Write the feed with ABSOLUTE asset URLs: the feed lives on the site,
      # the installer on the release. electron-builder writes bare file
      # names, which the generic provider would resolve against the site.
      # The tag is read back from the release so a mismatch fails loudly.
      - name: The feed only ever moves forward
        # electron-updater never downgrades: a feed that names a version at or
        # below what it already serves stops every updated laptop from
        # updating, silently. (SWITCH.md once asked for exactly that.)
        run: |
          set -euo pipefail
          FEED=site/updates/printer/latest.yml
          if [ -f "$FEED" ]; then
            CURRENT="$(sed -nE 's/^version:[[:space:]]*([0-9][0-9.]*).*/\1/p' "$FEED" | head -1)"
            if [ -n "$CURRENT" ]; then
              NEWEST="$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)"
              if [ "$CURRENT" = "$VERSION" ] || [ "$NEWEST" != "$VERSION" ]; then
                echo "::error::$FEED already serves $CURRENT; releasing $VERSION would stop every updated laptop from updating (electron-updater never downgrades). Pick a version above $CURRENT."
                exit 1
              fi
              echo "The feed moves from $CURRENT to $VERSION."
            fi
          fi

      - name: Write the update feed into the site
        run: |
          set -euo pipefail
          TAG="printer-v$VERSION"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          mkdir -p site/updates/printer
          BASE="$BASE" node -e '
            const fs = require("fs");
            const base = process.env.BASE;
            const abs = (v) => {
              v = v.trim().replace(/^["\x27]|["\x27]$/g, "");
              return /^https?:\/\//.test(v) ? v : `${base}/${encodeURIComponent(v)}`;
            };
            const out = fs.readFileSync("installer/latest.yml", "utf8").split("\n").map((line) => {
              const m = line.match(/^(\s*(?:-\s+)?(?:url|path):\s*)(.+?)\s*$/);
              return m ? m[1] + abs(m[2]) : line;
            }).join("\n");
            fs.writeFileSync("site/updates/printer/latest.yml", out);
          '
          cat site/updates/printer/latest.yml
          # The feed must name this version, and every url/path must be absolute.
          grep -Eq "^version: ${VERSION}\s*$" site/updates/printer/latest.yml
          if grep -E '^\s*(-\s+)?(url|path):' site/updates/printer/latest.yml | grep -vq "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/"; then
            echo "::error::a url/path in latest.yml is not an absolute release asset URL"; exit 1
          fi
          # ...and the assets it points at really are on the release.
          grep -E '^\s*(-\s+)?(url|path):' site/updates/printer/latest.yml | sed -E 's/^[^:]*:\s*//' | sort -u | while read -r u; do
            curl -fsSIL -o /dev/null "$u" || { echo "::error::feed points at a missing asset: $u"; exit 1; }
          done

      - name: Commit the feed and redeploy the site
        run: |
          set -euo pipefail
          git config user.name 'sync-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add site/updates/printer/latest.yml
          git commit -m "chore: printer ${VERSION} update feed"
          # main can move while the Windows build runs; rebase and retry.
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then break
            elif [ "$i" = 4 ]; then echo '::error::git push failed after retries'; exit 1
            else git fetch origin main; git rebase origin/main; sleep $((i * 3)); fi
          done
          # A push made with GITHUB_TOKEN fires no push trigger, so ask for
          # the CI run (and its deploy job) explicitly.
          gh workflow run ci.yml --repo "${GITHUB_REPOSITORY}" --ref main
          echo "### Released \`printer-v${VERSION}\`; feed committed and ci.yml dispatched" >> "$GITHUB_STEP_SUMMARY"
