name: Delete printer release

# Cleanup tool for a mistakenly created tag/release (duplicate, stray manual
# publish) -- symmetric with printer-release.yml. Deleting a release/tag hits
# the same restriction as creating one (a Claude Code session's git remote is
# commonly scoped to branch pushes only), so this does it via the workflow's
# own GITHUB_TOKEN instead.
#
# This deletes the release and tag ONLY. Installed printers read
# site/updates/printer/latest.yml, so if the bad release was the one that
# feed points at, also revert that file on main (git revert the feed commit)
# and let ci.yml redeploy; otherwise the feed keeps naming deleted assets.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact tag name to delete (e.g. printer-v5.0.2) -- also deletes the underlying git tag'
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            printer-v*) ;;
            *) echo "::error::This workflow only deletes printer-v* tags (got '$TAG'); use desktop-delete-release.yml for desktop-v*"; exit 1 ;;
          esac
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag --repo "${{ github.repository }}"
            echo "Deleted release and tag: $TAG" >> "$GITHUB_STEP_SUMMARY"
          # Check the REMOTE for the tag — the default shallow checkout does
          # not fetch tags, so a local `git rev-parse` reports every tag as
          # missing and the dangling-tag path never runs.
          elif git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git push origin --delete "refs/tags/$TAG"
            echo "No release found for $TAG — deleted the dangling tag only." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Neither a release nor a tag named '$TAG' exists"
            exit 1
          fi
