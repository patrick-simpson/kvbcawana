name: Delete desktop release

# Removes a stray or broken Awana Lobby Display release AND its tag. Installed
# apps no longer follow GitHub's "Latest" release: they read
# site/updates/lobby/lobby.yml. So if the release being removed is the one that
# feed points at, also revert that file on main (git revert the feed commit)
# and let ci.yml redeploy, or the feed keeps naming deleted assets.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact tag to delete, e.g. desktop-v1.0.1'
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Delete the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            desktop-v*) ;;
            *) echo "::error::This workflow only deletes desktop-v* tags (got '$TAG')"; exit 1 ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
            echo "Deleted release and tag $TAG"
          elif git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null; then
            git push origin --delete "refs/tags/$TAG"
            echo "No release; deleted tag $TAG"
          else
            echo "Nothing named $TAG"
          fi
