# Read-only: lists the account's D1 databases (names and ids; neither is a
# secret) and shows whether CLOUDFLARE_API_TOKEN may use D1. Run by hand when
# setting up or checking the history database.
name: D1 info

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app
        with:
          lockfile: lobby/worker/package-lock.json
          working-directory: lobby/worker
      - name: List D1 databases
        working-directory: lobby/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # An auth error from wrangler must fail this step, not vanish into the pipe to tee.
          set -o pipefail
          npx wrangler d1 list --json | tee d1.json
          node -e 'const l=require("./d1.json");for(const d of l)console.log(`${d.name}  ${d.uuid}`)' | tee -a "$GITHUB_STEP_SUMMARY"
