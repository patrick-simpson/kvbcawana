name: Transcode all lesson videos (Journey)

# Ported into the monorepo root; runs journey/scripts/transcode-all-lessons.mjs
# from journey/.
#
# Every video is encoded by journey/scripts/pi-encode.mjs, under 25 MiB (the
# site's file limit), and uploaded to the `journey-videos-v2` release here;
# site/build.mjs copies that release to awana.kvbchurch.org/journey/videos/ on
# every deploy, which is where the kiosk plays them from (2026-10-03).
#
# On-demand (not scheduled): re-encodes EVERY lesson video in
# journey/public/lessons.json to the Pi-Zero-playable 480p format and uploads them
# as assets on the `journey-videos-v2` GitHub Release, which the manual
# video-picker plays. Run it once to populate, and again only if Awana
# revises the course (rebuild lessons.json first) or an asset failed.
# Resumable: already-uploaded assets are skipped, so re-running after a
# partial failure only does the remaining work. See the script header for
# the owner-approved licensing boundary this operates under.

on:
  workflow_dispatch:

permissions:
  contents: write # create the release / upload assets

concurrency:
  group: journey-transcode-all-lessons
  cancel-in-progress: false

jobs:
  transcode:
    runs-on: ubuntu-latest
    # 63 videos × (download + transcode + upload) — comfortably under the
    # 6h job ceiling, but nowhere near the default 360min either way.
    timeout-minutes: 350
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Transcode and upload every lesson video
        working-directory: journey
        run: node scripts/transcode-all-lessons.mjs
        env:
          GH_TOKEN: ${{ github.token }}
