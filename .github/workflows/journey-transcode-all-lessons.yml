name: Transcode all lesson videos (Journey)

# Ported into the monorepo root; runs journey/scripts/transcode-all-lessons.mjs
# from journey/.
#
# TODO(release move): the script's `gh release` calls act on the repo this
# workflow runs in, so NEW uploads now go to a `transcoded-videos-v1` release
# in patrick-simpson/kvbcawana, not the old Journey-Display one. The kiosk
# plays them from the base URL in journey/public/src/schedule.js
# (TRANSCODED_BASE, line ~1994), which still points at
# https://github.com/patrick-simpson/Journey-Display/releases/download/transcoded-videos-v1/
# -- that old release stays downloadable, so existing videos keep working. Once
# this workflow has (re)populated the new release, change that constant to
# https://github.com/patrick-simpson/kvbcawana/releases/download/transcoded-videos-v1/
# (also journey/scripts/verify-caption-cue.py line 15 and
# transcribe-student-captions.py line 33). Resumability checks the NEW
# release's assets, so the first run re-transcodes every lesson; to avoid that,
# copy the old release's assets across by hand first. The script creates the
# release without --latest=false, so it may show as "Latest"; harmless, since
# neither Electron app reads "Latest" any more.
#
# On-demand (not scheduled): re-encodes EVERY lesson video in
# journey/public/lessons.json to the Pi-Zero-playable 480p format and uploads them
# as assets on the `transcoded-videos-v1` GitHub Release, which the manual
# video-picker plays. Run it once to populate, and again only if Awana
# revises the course (rebuild lessons.json first) or an asset failed.
# Resumable: already-uploaded assets are skipped, so re-running after a
# partial failure only does the remaining work. See the script header for
# the owner-approved licensing boundary this operates under.

on:
  workflow_dispatch:

permissions:
  contents: write # create the release / upload assets

concurrency:
  group: journey-transcode-all-lessons
  cancel-in-progress: false

jobs:
  transcode:
    runs-on: ubuntu-latest
    # 63 videos × (download + transcode + upload) — comfortably under the
    # 6h job ceiling, but nowhere near the default 360min either way.
    timeout-minutes: 350
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Transcode and upload every lesson video
        working-directory: journey
        run: node scripts/transcode-all-lessons.mjs
        env:
          GH_TOKEN: ${{ github.token }}
