name: Update calendar feed (Lobby)

# Ported into the monorepo root: scripts run from lobby/, the feed is
# committed to main and ci.yml is dispatched to redeploy the one site.
#
# Nightly: scrape the church calendar page into lobby/public/calendar-feed.json
# so the display reads club nights same-origin (the calendar site sends
# no CORS headers, so the browser can't fetch it directly). The script
# only rewrites the file when the events change (or weekly, as a
# heartbeat for the app's staleness check), so most nights commit nothing.

on:
  schedule:
    - cron: '17 8 * * *' # ~4:17 AM Eastern, off-peak minute
  workflow_dispatch:

permissions:
  contents: write # commit the refreshed feed
  actions: write  # dispatch ci.yml (GITHUB_TOKEN pushes don't self-trigger it)

concurrency:
  group: lobby-update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lobby
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-app
        with:
          lockfile: lobby/package-lock.json
          working-directory: lobby

      - name: Fetch and parse the calendar
        # Exits 1 (failing the run, which emails the repo owner) if the
        # page stops parsing — the last good committed feed keeps serving.
        run: node scripts/fetch-calendar.mjs

      - name: Commit and redeploy if the feed changed
        # Pushes made with the default GITHUB_TOKEN deliberately do NOT
        # trigger `on: push` workflows, so the deploy is dispatched
        # explicitly. ci.yml still runs every check before the deploy job.
        id: commit
        uses: ./.github/actions/push-main
        with:
          bot-name: calendar-bot
          working-directory: lobby
          paths: public/calendar-feed.json
          message: 'chore: refresh calendar feed'
          only-if-changed: 'true'
          unchanged-message: Feed unchanged — nothing to deploy.

      - name: Redeploy
        if: steps.commit.outputs.committed == 'true'
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
