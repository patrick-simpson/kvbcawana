name: Clean up old run files

# Deletes this repo's workflow artifacts older than a day, so they stop
# counting against the account's 0.5 GB of Actions storage (owner,
# 2026-10-11, after GitHub's 90% warning). Releases keep their own artifacts
# a day already (retention-days: 1); this clears what older runs left behind
# and anything that slips through.
#
# Old installers too (owner 2026-11-15, after 77 releases had built up to
# 18.5 GB): the `installers` job keeps the newest 3 KVBC Awana releases
# (printer-v*) and deletes the rest, each about 240 MB. It NEVER deletes a
# release the update feed on main names (site/updates/printer/latest.yml: the
# installed apps download from it), and does nothing at all when it cannot
# read that feed. Git tags stay (they cost nothing); only the release and its
# files go. Other releases (the Journey videos, the old sound room app's last
# installer, the brand catalog) are not its business.
#
# Every morning, and from Actions -> Clean up old run files -> Run
# workflow, where "Older than" can be changed.

on:
  schedule:
    - cron: '17 9 * * *' # daily 09:17 UTC (5:17 am Eastern in summer, 4:17 in winter)
  workflow_dispatch:
    inputs:
      days:
        description: Delete run files older than this many days
        type: number
        default: 1

permissions: {}

concurrency:
  group: clean-artifacts
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ inputs.days || 1 }}
        run: |
          set -euo pipefail
          if ! [[ "$DAYS" =~ ^[0-9]+$ ]]; then echo "Older than must be a whole number of days."; exit 1; fi
          cutoff="$(date -u -d "-${DAYS} days" +%Y-%m-%dT%H:%M:%SZ)"
          echo "Deleting artifacts created before $cutoff (older than $DAYS day(s))."
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired == false and .created_at < \"$cutoff\") | \"\(.id) \(.size_in_bytes) \(.name)\"" \
            > old.txt
          count=0; bytes=0
          while read -r id size name; do
            if gh api -X DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null; then
              count=$((count + 1)); bytes=$((bytes + size))
              echo "Deleted $name ($((size / 1048576)) MB)"
            else
              echo "::warning::Could not delete $name (artifact $id)"
            fi
          done < old.txt
          summary="Deleted $count old run file(s), $((bytes / 1048576)) MB."
          echo "$summary"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"

  installers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # deleting a release
    steps:
      - name: Delete old installer releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: 3
        run: |
          set -euo pipefail
          # The feed the installed apps read. No feed, no deleting.
          if ! feed="$(gh api "repos/$REPO/contents/site/updates/printer/latest.yml?ref=main" -H "Accept: application/vnd.github.raw")"; then
            echo "::warning::Could not read the update feed, so no release was deleted."; exit 0
          fi
          version="$(printf '%s\n' "$feed" | sed -n 's/^version:[[:space:]]*//p' | head -n1 | tr -d "\r\"'")"
          if [ -z "$version" ]; then echo "::warning::The update feed names no version, so no release was deleted."; exit 0; fi
          current="printer-v$version"
          # Newest first. A release still being made (a draft) is left alone.
          gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq '.[] | select(.draft == false and (.tag_name | startswith("printer-v"))) | "\(.created_at) \(.tag_name) \([.assets[].size] | add // 0)"' \
            | sort -r > releases.txt
          if ! grep -q " $current " releases.txt; then
            echo "::warning::The feed's release $current is not among the releases, so no release was deleted."; exit 0
          fi
          n=0; count=0; bytes=0
          while read -r _ tag size; do
            n=$((n + 1))
            if [ "$n" -le "$KEEP" ]; then echo "Keeping $tag (one of the newest $KEEP)"; continue; fi
            if [ "$tag" = "$current" ] || printf '%s\n' "$feed" | grep -qF "/$tag/"; then echo "Keeping $tag (the update feed names it)"; continue; fi
            if gh release delete "$tag" --repo "$REPO" --yes >/dev/null; then
              count=$((count + 1)); bytes=$((bytes + size))
              echo "Deleted $tag ($((size / 1048576)) MB)"
            else
              echo "::warning::Could not delete $tag"
            fi
          done < releases.txt
          summary="Deleted $count old installer release(s), $((bytes / 1048576)) MB. The feed serves $current."
          echo "$summary"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
