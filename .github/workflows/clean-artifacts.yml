name: Clean up old run files

# Deletes this repo's workflow artifacts older than a day, so they stop
# counting against the account's 0.5 GB of Actions storage (owner,
# 2026-10-11, after GitHub's 90% warning). Releases keep their own artifacts
# a day already (retention-days: 1); this clears what older runs left behind
# and anything that slips through. The installers people download live on
# the Releases, which this never touches.
#
# Weekly on Monday morning, and from Actions -> Clean up old run files -> Run
# workflow, where "Older than" can be changed.

on:
  schedule:
    - cron: '17 9 * * 1' # Mondays 09:17 UTC (5:17 am Eastern in summer, 4:17 in winter)
  workflow_dispatch:
    inputs:
      days:
        description: Delete run files older than this many days
        type: number
        default: 1

permissions:
  actions: write

concurrency:
  group: clean-artifacts
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ inputs.days || 1 }}
        run: |
          set -euo pipefail
          if ! [[ "$DAYS" =~ ^[0-9]+$ ]]; then echo "Older than must be a whole number of days."; exit 1; fi
          cutoff="$(date -u -d "-${DAYS} days" +%Y-%m-%dT%H:%M:%SZ)"
          echo "Deleting artifacts created before $cutoff (older than $DAYS day(s))."
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired == false and .created_at < \"$cutoff\") | \"\(.id) \(.size_in_bytes) \(.name)\"" \
            > old.txt
          count=0; bytes=0
          while read -r id size name; do
            if gh api -X DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null; then
              count=$((count + 1)); bytes=$((bytes + size))
              echo "Deleted $name ($((size / 1048576)) MB)"
            else
              echo "::warning::Could not delete $name (artifact $id)"
            fi
          done < old.txt
          summary="Deleted $count old run file(s), $((bytes / 1048576)) MB."
          echo "$summary"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
