name: Print to the downstairs Epson

# Owner 2026-10-28: newsletter text in, the Awana letterhead (shared/letterhead.js,
# the same drawing as awana.kvbchurch.org/tools/print/) out, COPIES times in
# ONE PDF, emailed from the owner's Gmail to the downstairs Epson (Epson Connect
# email print takes no copy count from the mail, so the copies are pages).
# Or a ready-made PDF, repeated the same way (owner 2026-11-04: the poster
# contest ballots, the Parents' Night half sheet): pdf_url, a file on this repo's
# releases, or pdf_file, a .pdf the repo holds under prints/ (public: nothing
# private). The one print job (owner 2026-11-04: "merge the two print jobs").
# Or pdf_job, an upload from the letterhead page's "Print a PDF" (owner 2026-11-04;
# the sync Worker starts this job, worker/src/prints.js, routes.md 10.16): the
# PDF scrambled in the browser, read from the Worker with HANDBOOK_TOKEN, opened
# with the key in pdf_job, deleted from the Worker afterwards.
# Started by hand, or by the Claude routine that turns a MailChimp newsletter
# (Gmail label "Letterhead") into this text. It prints at once, by the owner's
# choice; a dry run mails one copy to GMAIL_USER instead.
#
# Never retried: a send that failed after Gmail took it would print the copies
# twice. A failure fails the job (GitHub emails the owner).
# Secrets: the handbook job's GMAIL_USER and GMAIL_APP_PASSWORD.

on:
  workflow_dispatch:
    inputs:
      text:
        description: 'The letter: first line is the title (see /tools/print/ for the format). Leave empty with a PDF below.'
        type: string
        required: false
      pdf_url:
        description: 'Or a ready-made PDF on this repo''s GitHub releases (https://github.com/patrick-simpson/kvbcawana/releases/download/...pdf)'
        type: string
        required: false
      pdf_file:
        description: 'Or a PDF in this repo under prints/ (e.g. prints/2026-11-04-parents-night-half-sheet.pdf)'
        type: string
        required: false
      pdf_job:
        description: 'Or an upload from the letterhead page (filled in by the page: <id>.<key>)'
        type: string
        required: false
      copies:
        description: 'Copies (1 to 100)'
        type: string
        default: '50'
      to:
        description: 'Send to: the downstairs Epson or GMAIL_USER only (anything else is refused)'
        type: string
        default: 'kvbcdownstairs@print.epsonconnect.com'
      dry_run:
        description: 'Dry run: one copy emailed to GMAIL_USER instead of the printer'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: letterhead-print
  cancel-in-progress: false

jobs:
  print:
    name: Letterhead
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/letterhead/package-lock.json
      - name: Install
        working-directory: scripts/letterhead
        run: npm ci
      # Chromium draws a LETTER only; a ready-made PDF needs none of it (2026-11-04:
      # the browser install hung for over 10 minutes on the ballots run).
      - name: Install Chromium (letters only)
        if: inputs.text != ''
        working-directory: scripts/letterhead
        run: npx playwright install --with-deps --only-shell chromium
      - name: Make and send the letter
        working-directory: scripts/letterhead
        env:
          LETTER_TEXT: ${{ inputs.text }}
          PDF_URL: ${{ inputs.pdf_url }}
          PDF_FILE: ${{ inputs.pdf_file }}
          PDF_JOB: ${{ inputs.pdf_job }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://awana.kvbchurch.org' }}
          PRINT_FETCH_TOKEN: ${{ secrets.HANDBOOK_TOKEN }}
          COPIES: ${{ inputs.copies }}
          TO: ${{ inputs.to || 'kvbcdownstairs@print.epsonconnect.com' }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node letterhead-print.mjs
