name: Print a PDF

# Owner 2026-11-04 (the Parents' Night half sheet): a PDF the repo holds under
# prints/, COPIES times in ONE PDF, emailed from the owner's Gmail to the
# downstairs Epson (Epson Connect email print takes no copy count from the mail,
# so the copies are pages). Started by hand or by Claude; prints at once. A dry
# run mails one copy to GMAIL_USER instead.
#
# Never retried: a send that failed after Gmail took it would print twice. A
# failure fails the job (GitHub emails the owner).
# Secrets: the handbook job's GMAIL_USER and GMAIL_APP_PASSWORD.

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'The PDF in the repo (under prints/)'
        type: string
        required: true
      copies:
        description: 'Copies (1 to 100)'
        type: string
        default: '1'
      to:
        description: 'Send to (the downstairs Epson)'
        type: string
        default: 'kvbcdownstairs@print.epsonconnect.com'
      dry_run:
        description: 'Dry run: one copy emailed to GMAIL_USER instead of the printer'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: print-pdf
  cancel-in-progress: false

jobs:
  print:
    name: Print a PDF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/letterhead/package-lock.json
      - name: Install
        working-directory: scripts/letterhead
        run: npm ci
      - name: Send the PDF
        working-directory: scripts/letterhead
        env:
          FILE: ${{ inputs.file }}
          COPIES: ${{ inputs.copies }}
          TO: ${{ inputs.to || 'kvbcdownstairs@print.epsonconnect.com' }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node print-pdf.mjs
