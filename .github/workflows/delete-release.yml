name: Delete release

# Cleanup tool for a mistakenly created tag/release (duplicate, stray manual
# publish) -- symmetric with printer-release.yml (and the retired
# desktop-release.yml: `desktop` still deletes an old sound room release).
# Deleting a release/tag hits the same restriction as creating one (a Claude
# Code session's git remote is commonly scoped to branch pushes only), so
# this does it via the workflow's own GITHUB_TOKEN instead.
#
# This deletes the release and tag ONLY. Installed apps read their update
# feed, not GitHub's "Latest" release (printer: site/updates/printer/latest.yml,
# desktop / sound room: site/updates/lobby/lobby.yml). It REFUSES a release a
# feed on main still serves (named in its urls or its version): deleting that
# would leave every church PC offered a missing installer, and a leaked
# dispatch token must not be able to do it. To remove a bad release the feed
# points at, first revert the feed commit on main (git revert) and let ci.yml
# redeploy, then run this. It runs only from main (its guard lives there).
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app the release belongs to (its tag starts printer-v / desktop-v)'
        type: choice
        required: true
        options:
          - printer
          - desktop
      tag:
        description: 'Exact tag name to delete (e.g. printer-v5.0.2 or desktop-v1.0.1) -- also deletes the underlying git tag'
        required: true

permissions:
  contents: write

jobs:
  delete:
    # Dispatched from another branch, an older copy of this file (without the
    # guard below) would run: only main's copy may delete.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # The update feeds are ours (site/updates/**), not GitHub's "Latest": a
      # feed on main still naming this tag would keep offering a deleted
      # installer to every installed app. Read main itself (not whatever was
      # checked out) and refuse.
      - name: Refuse a release a feed on main still serves
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch -q origin main
          for feed in site/updates/printer/latest.yml:printer-v site/updates/lobby/lobby.yml:desktop-v; do
            file="${feed%%:*}"; prefix="${feed##*:}"
            body="$(git show "origin/main:$file" 2>/dev/null || true)"
            [ -n "$body" ] || continue
            current="$(printf '%s\n' "$body" | sed -nE 's/^version:[[:space:]]*["\x27]?([0-9][0-9.]*).*/\1/p' | head -1)"
            if [ -n "$current" ] && [ "$TAG" = "${prefix}${current}" ]; then
              echo "::error::$TAG is the CURRENT release in $file on main. Revert that feed on main first, then delete it."
              exit 1
            fi
            if printf '%s\n' "$body" | grep -qF -- "/$TAG/"; then
              echo "::error::$file on main still points at $TAG. Revert that feed on main first, then delete it."
              exit 1
            fi
          done
          echo "No feed on main serves $TAG."

      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ inputs.app }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$APP" in
            printer) PREFIX=printer-v ;;
            desktop) PREFIX=desktop-v ;;
            *) echo "::error::Unknown app '$APP' (expected printer or desktop)"; exit 1 ;;
          esac
          case "$TAG" in
            "$PREFIX"*) ;;
            *) echo "::error::App '$APP' only deletes ${PREFIX}* tags (got '$TAG'); pick the other app for the other prefix"; exit 1 ;;
          esac
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag --repo "${{ github.repository }}"
            echo "Deleted release and tag: $TAG" >> "$GITHUB_STEP_SUMMARY"
          # Check the REMOTE for the tag — the default shallow checkout does
          # not fetch tags, so a local `git rev-parse` reports every tag as
          # missing and the dangling-tag path never runs.
          elif git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git push origin --delete "refs/tags/$TAG"
            echo "No release found for $TAG — deleted the dangling tag only." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Neither a release nor a tag named '$TAG' exists"
            exit 1
          fi
