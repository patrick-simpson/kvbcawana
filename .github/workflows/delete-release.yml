name: Delete release

# Cleanup tool for a mistakenly created tag/release (duplicate, stray manual
# publish) -- symmetric with printer-release.yml and desktop-release.yml.
# Deleting a release/tag hits the same restriction as creating one (a Claude
# Code session's git remote is commonly scoped to branch pushes only), so
# this does it via the workflow's own GITHUB_TOKEN instead.
#
# This deletes the release and tag ONLY. Installed apps read their update
# feed, not GitHub's "Latest" release (printer: site/updates/printer/latest.yml,
# desktop / sound room: site/updates/lobby/lobby.yml), so if the bad release
# was the one that feed points at, also revert that file on main (git revert
# the feed commit) and let ci.yml redeploy; otherwise the feed keeps naming
# deleted assets.
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app the release belongs to (its tag starts printer-v / desktop-v)'
        type: choice
        required: true
        options:
          - printer
          - desktop
      tag:
        description: 'Exact tag name to delete (e.g. printer-v5.0.2 or desktop-v1.0.1) -- also deletes the underlying git tag'
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ inputs.app }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$APP" in
            printer) PREFIX=printer-v ;;
            desktop) PREFIX=desktop-v ;;
            *) echo "::error::Unknown app '$APP' (expected printer or desktop)"; exit 1 ;;
          esac
          case "$TAG" in
            "$PREFIX"*) ;;
            *) echo "::error::App '$APP' only deletes ${PREFIX}* tags (got '$TAG'); pick the other app for the other prefix"; exit 1 ;;
          esac
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag --repo "${{ github.repository }}"
            echo "Deleted release and tag: $TAG" >> "$GITHUB_STEP_SUMMARY"
          # Check the REMOTE for the tag — the default shallow checkout does
          # not fetch tags, so a local `git rev-parse` reports every tag as
          # missing and the dangling-tag path never runs.
          elif git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git push origin --delete "refs/tags/$TAG"
            echo "No release found for $TAG — deleted the dangling tag only." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Neither a release nor a tag named '$TAG' exists"
            exit 1
          fi
