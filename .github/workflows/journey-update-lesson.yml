name: Update current lesson (Journey)

# Ported into the monorepo root (GitHub reads only the root .github/workflows).
# Scripts run from journey/; the commit lands on main and ci.yml is dispatched
# to redeploy the one site, replacing the old repo's own Pages deploy.
#
# Nightly: resolve which Journey: Advocates lesson is "current" from the
# church's TwoTimTwo calendar and write journey/public/current-lesson.json, so
# the kiosk reads it same-origin instead of hitting a third-party site
# at 6:30 PM. Only rewrites when the lesson changes (or weekly, as a
# heartbeat for staleness), so most nights commit nothing.
#
# Also transcodes that lesson's video down to something the kiosk's weak
# Raspberry Pi Zero can actually decode smoothly (~5x smaller than Awana's
# original) — see the top of journey/scripts/transcode-lesson-video.mjs for the
# full rationale, including the deliberate, informed exception this makes to
# this project's normal "never re-host the original video files" rule
# (CLAUDE.md).
#
# The video is never committed (owner, 2026-10-12; every lesson added ~20 MB to
# history): it replaces the asset current-lesson-video.mp4 on the
# journey-videos-v2 release (the same release as every lesson's 480p copy), and
# the site streams that asset at /journey/current-lesson-video.mp4, the URL the
# Pi always used. What is committed is journey/public/current-lesson-video.json
# (its sha256), so Journey's build hash moves when the lesson does. The upload
# comes BEFORE the commit: if it fails the job fails and nothing is committed,
# so the deployed JSON never names a video the release does not hold.

on:
  schedule:
    - cron: '23 8 * * *' # ~4:23 AM Eastern, off-peak minute
  workflow_dispatch:

permissions:
  contents: write # commit the refreshed feed, replace the release asset
  actions: write  # dispatch ci.yml (GITHUB_TOKEN pushes don't self-trigger it)

concurrency:
  group: journey-update-lesson
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: journey
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-app
        with:
          lockfile: journey/package-lock.json
          working-directory: journey

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Resolve the current lesson
        # Exits 1 (failing the run, which emails the repo owner) if the
        # page stops parsing, or if public/lessons.json isn't populated
        # yet — the last good committed lesson keeps serving either way.
        run: npm run fetch-lesson

      - name: Check the release copy of the lesson video
        # The sha256 GitHub records for the asset (empty when there is none).
        # The transcode below is skipped only when it equals the committed
        # pointer's, so a lost or half-done upload is made again. If GitHub
        # cannot be asked, the release is not checked (checked=0) rather than
        # treated as empty, which would re-encode a video that is fine.
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/journey-videos-v2" --jq '[.assets[] | select(.name == "current-lesson-video.mp4") | .digest // ""] | first // ""')"; then
            echo "checked=1" >> "$GITHUB_OUTPUT"
            echo "sha256=${digest#sha256:}" >> "$GITHUB_OUTPUT"
            echo "Release copy: ${digest:-none}"
          else
            echo "::warning::Could not read the journey-videos-v2 release; trusting the committed pointer."
            echo "checked=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Transcode the lesson video
        # Never fails the job on its own (see the script's own comments) —
        # a transcode failure just leaves current-lesson.json's downloadUrl
        # pointing at the original, full-size, still-playable source.
        # Writes build/current-lesson-video.mp4 only when it made a new one.
        run: npm run transcode-lesson
        env:
          RELEASE_VIDEO_CHECKED: ${{ steps.release.outputs.checked }}
          RELEASE_VIDEO_SHA256: ${{ steps.release.outputs.sha256 }}

      - name: Upload the new lesson video to the release
        # Replaces the one asset in place (same name, so the site's URL never
        # changes), then checks GitHub holds exactly the bytes the pointer
        # names. Fails the job before the commit when it does not.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f build/current-lesson-video.mp4 ]; then echo 'No new video to upload.'; exit 0; fi
          gh release upload journey-videos-v2 build/current-lesson-video.mp4 --clobber --repo "$GITHUB_REPOSITORY"
          want="$(node -p "require('./public/current-lesson-video.json').sha256")"
          got="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/journey-videos-v2" --jq '.assets[] | select(.name == "current-lesson-video.mp4") | .digest')"
          if [ "$got" != "sha256:$want" ]; then
            echo "::error::Release asset is ${got:-missing}, expected sha256:$want"
            exit 1
          fi
          echo "Uploaded sha256:$want"

      - name: Commit the refreshed lesson, if anything changed
        # Pushes made with the default GITHUB_TOKEN deliberately do NOT
        # trigger `on: push` workflows — see the dispatch step below.
        # Rebases and retries on push rejection: this repo's own
        # convention is "commit and push to main on every change", so a
        # concurrent human push during the time this job spends on
        # `npm ci`, the TwoTimTwo fetch, and the video download+transcode
        # is routine, not exceptional, and should not cost a night's work.
        uses: ./.github/actions/push-main
        with:
          bot-name: lesson-bot
          working-directory: journey
          paths: public/current-lesson.json public/current-lesson-video.json
          message: 'chore: refresh current lesson'
          only-if-changed: 'true'
          unchanged-message: Lesson unchanged — nothing to commit.

      - name: Redeploy
        # Dispatched on every run, not only when the lesson changed: the
        # old workflow only dispatched inside the "lesson changed"
        # branch, with nothing verifying the dispatched deploy actually
        # succeeded — if that one deploy run failed or was cancelled, the
        # unchanged-lesson nights that followed took the other branch
        # forever, and main's new lesson never reached the live site with
        # no visible failure anywhere. A no-op site deploy is cheap, so
        # reconciling unconditionally is worth it for that guarantee.
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
