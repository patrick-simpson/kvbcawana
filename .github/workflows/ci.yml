name: CI

# One test run for the whole family. Each app keeps exactly the checks its
# old repo ran; the copies the three used to compare over the network
# (contract and envelope vectors) are compared here directly; the brand kit
# is kept once and copied into each app at build time. Nothing deploys from this repo yet: the apps' own
# workflows sit dormant under their folders (GitHub reads only the root's) until the
# one-site move at awana.kvbchurch.org replaces them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_worker:
        # After adding or changing a Worker secret in GitHub (the TWOTIMTWO_*
        # ones for cloud check-in): the Worker only redeploys, and so only
        # receives its secrets, when this is ticked or its sources changed.
        description: Redeploy the sync Worker and re-send its secrets (drops every screen's socket for a moment)
        type: boolean
        default: false

permissions:
  contents: read

# A newer run replaces an older one's TEST jobs (job-level groups below), so
# a burst of pushes to main no longer queues, one run after another, behind
# the first. It is done per job and not here, on purpose: a workflow-level
# `cancel-in-progress` cancels the whole older run, and a deploy job that had
# started (the Worker shipped, the site not yet published) would be cut off
# half way. The deploy job has its own group and is never cancelled.
# Because the older run's tests may have been the only ones to see a change,
# "What changed" compares with the last GREEN run of this workflow, not with
# the previous commit, so nothing a cancelled run was checking goes untested.

jobs:
  # Which slow suites this push can affect. The lobby's (7.5 min, mostly the
  # browser tests) and the printer's (3 min) are skipped only when EVERY
  # changed file is one that suite was checked never to read (owner,
  # 2026-10-11: a Worker fix waited 8 minutes on lobby tests it cannot touch).
  # Anything unknown runs everything: a manual run or a bot's dispatch, no
  # base to compare with, or a change to this file. The fast jobs always run.
  #   lobby   reads only lobby/ (the Worker, worker/, has its own job), plus
  #           journey/public/src/schedule.js, journey/public/src/sync.js and
  #           journey/src/schedule/19-picker-final-step.js (the phone remote's picker choices)
  #           printer/contract-vectors.json and printer/envelope-vectors.json
  #           (the lobby's tests read the one copy in place),
  #           site/checkin/ and printer/print-server/public/phone.html
  #           (e2e/checkin.spec.js serves the one check-in page, built from the
  #           phone page by site/checkin/checkin-page.mjs, from a stub origin)
  #   printer reads printer/, plus, since the online check-in end-to-end test
  #           (printer/scripts/test-cloud-e2e.cjs) runs the Worker in process,
  #           ALL of worker/src, worker/migrations, the four test
  #           helpers it reuses (rig, helpers, fixtures, d1stub), the Worker's
  #           package files (its two runtime packages are installed for it) and
  #           the lobby/src/lib and shared files the Worker imports
  #           (calendarParse, envelope, settingRules, sharedSettings, slides,
  #           syncSpecs; text.js; tonight.js, whose generated copy is the
  #           print server's count; clubNight.js and schedule.json, the
  #           desk's club-day rule), site/build.mjs (test-phone-touch),
  #           lobby/src/lib/syncSpecs.js and the shared/sync-protocol.js it
  #           re-exports (electron-app's device-sync test), and shared/brand/
  #           (the print server's brand kit is a copy of it, made before the tests
  #           by scripts/family-assets.mjs; the home page imports its shapes,
  #           doodles and club marks, and test-about-page reads them)
  #           and the settings page's laptop cards, which replaced the
  #           print dashboard (lobby/src/lib/printServer.js and
  #           lobby/src/components/settings/laptop*.jsx: test-leaders,
  #           test-custom-label, test-pickup-board, test-attendance-audit,
  #           test-server-security, test-server-helpers)
  #           and shared/cloud-vectors.json (test-cloud-crypto reads it;
  #           its print-server/cloud-crypto.js is generated from
  #           shared/cloud-crypto.js, which the copies job checks)
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read   # list this workflow's earlier runs
    outputs:
      lobby: ${{ steps.pick.outputs.lobby }}
      printer: ${{ steps.pick.outputs.printer }}
      base: ${{ steps.pick.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          base=""
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -Eq '^0+$'; then
            base="$BEFORE"
            # A newer push cancels the older run's tests, so the commit before
            # this one may never have been tested. The newest earlier run of
            # this workflow on main that finished green, and whose commit is
            # an ancestor of this one, is the last tree known good: compare
            # with that, so every change since it is covered by this run.
            green="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=30" --jq '.workflow_runs[].head_sha' 2>/dev/null || true)"
            for sha in $green; do
              if [ "$sha" != "$GITHUB_SHA" ] && git cat-file -e "$sha^{commit}" 2>/dev/null && git merge-base --is-ancestor "$sha" HEAD; then base="$sha"; break; fi
            done
          elif [ "$EVENT" = "pull_request" ] && [ -n "$PR_BASE" ]; then base="$PR_BASE"; fi
          files=""
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then files="$(git diff --name-only "$base" HEAD)"; fi
          lobby=true; printer=true
          if [ -n "$base" ] && [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qx '.github/workflows/ci.yml'; then
            lobby=false; printer=false
            while IFS= read -r f; do
              # A note at the top level (ROADMAP.md#cloud-check-in, CLAUDE.md) is read by no
              # suite. (In a case pattern * also matches "/", so this is a test.)
              if [[ "$f" != */* && "$f" == *.md ]]; then continue; fi
              case "$f" in
                journey/public/src/schedule.js|journey/public/src/sync.js|journey/src/schedule/19-picker-final-step.js) lobby=true ;;  # screenSpecs.test.js reads both, embed.test.js sync.js, shared/journeyRemote.test.js the picker's choices
                site/checkin/*|printer/print-server/public/phone.html|printer/print-server/sync-protocol.js) lobby=true ;;
                printer/contract-vectors.json|printer/envelope-vectors.json) lobby=true ;;  # the lobby's sanitizer and envelope tests read the one copy in place  # e2e/checkin.spec.js serves the check-in page (site/checkin/checkin-page.mjs builds it from phone.html)
                worker/*|printer/*|journey/*|site/*|.github/workflows/*) ;;
                *) lobby=true ;;
              esac
              case "$f" in
                worker/src/*|worker/migrations/*|worker/test/rig.js|worker/test/helpers.js|worker/test/fixtures.js|worker/test/d1stub.js|worker/package.json|worker/package-lock.json|lobby/src/lib/calendarParse.js|lobby/src/lib/envelope.js|lobby/src/lib/settingRules.js|lobby/src/lib/sharedSettings.js|lobby/src/lib/slides.js|lobby/src/lib/syncSpecs.js|shared/journeyRemote.js|shared/text.js|shared/sync-protocol.js|shared/brand/*|shared/cloud-crypto.js|shared/cloud-vectors.json|shared/tonight.js|shared/pickup.js|shared/clubs.js|shared/clubNight.js|shared/schedule.json|shared/churchSettings.js|lobby/src/lib/printServer.js|lobby/src/components/settings/laptop*.jsx|site/build.mjs) printer=true ;;
                lobby/*|journey/*|site/updates/*|.github/workflows/*) ;;
                *) printer=true ;;
              esac
            done <<< "$files"
          fi
          echo "Changed since ${base:-unknown}: $(printf '%s\n' "$files" | grep -c . || true) file(s). Lobby tests: $lobby. Printer tests: $printer."
          echo "lobby=$lobby" >> "$GITHUB_OUTPUT"
          echo "printer=$printer" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "push" ]; then echo "base=$base" >> "$GITHUB_OUTPUT"; fi

  copies:
    name: Family copies match
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The brand kit and the sync modules have one canonical file each; the apps'
      # copies are generated (and gitignored), so make them, then check them.
      - run: node scripts/family-assets.mjs
      # family-assets also rewrites the COMMITTED CommonJS copies (printer/print-server/*.js);
      # a run that changed one means a commit forgot to regenerate it.
      - name: Committed copies were regenerated
        run: |
          git diff --exit-code --stat || { echo "::error::A committed generated copy is stale. Run node scripts/family-assets.mjs and commit."; exit 1; }
      - run: node scripts/check-mirrors.mjs

  lobby-checks:
    # Lint, typecheck and the vitest suite. Runs beside lobby-e2e (which
    # builds and drives the browser), so the two halves of the old 7.5-minute
    # serial lobby job overlap.
    name: Lobby + projector (lint, types, unit tests)
    needs: changes
    if: needs.changes.outputs.lobby == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: lobby-checks-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: lobby
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app
        with:
          lockfile: lobby/package-lock.json
          working-directory: lobby
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

  lobby-e2e:
    # The smoke and events suites (237 + 51 tests, about 7 minutes on one runner) in 4 shards. The
    # shards split by test (--fully-parallel): touch.spec.js alone holds 88
    # of them, and by file the shards would be 74 / 75 / 88 / 0. Every shard
    # builds and installs on its own; the deploy job needs the job, so it
    # waits for all four.
    name: Lobby + projector (browser smoke ${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.lobby == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    concurrency:
      group: lobby-e2e-${{ matrix.shard }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: lobby
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app
        with:
          lockfile: lobby/package-lock.json
          working-directory: lobby
      - name: Build
        run: npm run build
      # Chromium is cached by the version of @playwright/test the lockfile
      # installs (the browser build is tied to it). A hit still needs the OS
      # libraries, which live outside the cache.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium and its system libraries
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries (browser cached)
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: E2E smoke
        run: npm run e2e -- --fully-parallel --shard=${{ matrix.shard }}/4
      # The events project (51 tests, about 3 minutes on one runner): real-time
      # frames of the check-in moment, toasts, pickup board, flagship and the
      # embedded corner. Sharded like the smoke suite. The `visual` project is
      # NOT run here: its baselines are regenerated only by
      # lobby-update-snapshots.yml and a pixel drift must not block a deploy.
      - name: E2E events
        run: npm run e2e:events -- --fully-parallel --shard=${{ matrix.shard }}/4
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lobby-playwright-report-${{ matrix.shard }}
          path: lobby/playwright-report
          retention-days: 7

  worker:
    name: Sync Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      # The Worker has its own lint and test tools (it left lobby/ on 2026-10-16);
      # the lobby files it imports need no packages of their own.
      - uses: ./.github/actions/setup-app
        with:
          lockfile: worker/package-lock.json
          working-directory: worker
      - run: npm run lint
      - run: npm test

  journey:
    name: Journey kiosk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: journey
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app
        with:
          lockfile: journey/package-lock.json
          working-directory: journey
      - run: node scripts/build-schedule.mjs --check && node --check public/src/schedule.js && node --check public/src/sync.js
      - run: npm test

  printer:
    name: Club Label Printer
    needs: changes
    if: needs.changes.outputs.printer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: printer-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: printer
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app
        with:
          lockfile: |
            printer/package-lock.json
            printer/print-server/package-lock.json
          working-directory: printer
      - run: npm ci
        working-directory: printer/print-server
      # test-cloud-e2e.cjs runs the sync Worker in process: its two runtime
      # packages (linkedom, parse5), not wrangler.
      - run: npm ci --omit=dev --prefix ../worker
      # The suites take their own ports (scripts/free-port.cjs), so the runner
      # (scripts/run-tests.cjs) runs them 4 at a time; `-- --serial` is the old order.
      - run: npm test
      - run: npm run build

  site:
    # site/build.mjs has hard failures (a page that lost the shape /checkin
    # expects, a file over Pages' 25 MiB that is not in the repo, a missing
    # must-have) and the Pages Function has tests. Both used to run only
    # inside the main-only deploy job, after the Worker had already shipped,
    # so a PR never saw them. Here they run on every push and PR. The deploy
    # job builds the same commit again itself rather than taking this job's
    # dist as a run file: run files count against the account's 0.5 GB of
    # Actions storage, and with the owner's $0 Actions budget a full storage
    # would block the upload and stop every deploy (owner, 2026-10-12).
    name: The one site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            lobby/package-lock.json
            printer/package-lock.json
      - name: Install
        run: |
          npm ci --prefix lobby
          npm ci --prefix printer
      - name: Build the site
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://awana.kvbchurch.org' }}
        run: node site/build.mjs
      - name: Test the Pages Function
        run: node --test site/test/*.test.mjs

  deploy:
    # The site is built first (its failures are the cheap ones), then the
    # sync Worker, then the site is published, once every check above is
    # green. Until CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID exist it
    # stops, green. SITE_ORIGIN (a repository variable) is the site's
    # address, https://awana.kvbchurch.org; a deploy without it fails rather
    # than quietly publishing a site that points at the wrong host.
    name: Deploy to Cloudflare
    # A suite "What changed" skipped is not a failure: !failure() and
    # !cancelled() let the deploy run past it, and still stop on any red job.
    # A test job a newer run cancelled is neither failed nor skipped, so it is
    # named: without that this older run would deploy untested.
    if: ${{ !failure() && !cancelled() && !contains(needs.*.result, 'cancelled') && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: [changes, copies, lobby-checks, lobby-e2e, worker, journey, printer, site]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deploys take turns and are never cancelled; of several waiting, only
    # the newest stays (GitHub replaces an older pending job in a group).
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            lobby/package-lock.json
            printer/package-lock.json
      - name: Check the Cloudflare secrets
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set, so nothing was deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the Worker's packages (wrangler)
        if: steps.ready.outputs.ready == 'true'
        run: npm ci --prefix worker
      - name: Build the site
        # Same commit and SITE_ORIGIN as the site job's checked build (no run
        # file hand-off: see the site job). dist, plus
        # site/lib/large-files.generated.js (the Pages Function imports it).
        if: steps.ready.outputs.ready == 'true'
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: |
          if [ -z "$SITE_ORIGIN" ]; then
            echo "::error::Set the repository variable SITE_ORIGIN (https://awana.kvbchurch.org) before deploying."; exit 1
          fi
          npm ci --prefix lobby
          npm ci --prefix printer
          node site/build.mjs
      - name: Check the site's origin
        if: steps.ready.outputs.ready == 'true'
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: |
          if [ -z "$SITE_ORIGIN" ]; then
            echo "::error::The SITE_ORIGIN repository variable is not set (https://awana.kvbchurch.org). Nothing was deployed."
            exit 1
          fi
          test -f site/dist/index.html && test -f site/dist/lobby/shared/sync.json && test -f site/lib/large-files.generated.js
          grep -q "\"url\": \"${SITE_ORIGIN%/}/api\"" site/dist/lobby/shared/sync.json || { echo "::error::The built site does not point at $SITE_ORIGIN/api."; exit 1; }
      - name: Did the Worker change?
        # Every deploy of the Worker is a new version, and a new version
        # restarts its Durable Object: every lobby TV, the projector and the
        # Journey kiosk lose their live socket and reconnect. Deploying it on
        # every push (the nightly bots' feed and lesson commits included) did
        # that several times a day for nothing. It deploys only when something
        # it is built from changed: its own folder, the lobby lib files it
        # imports, or this workflow. A push compares against the commit before
        # it; a dispatch (the bots and the release workflows dispatch this
        # right after their own one commit) against the parent; anything
        # unknowable deploys, the safe direction.
        id: worker
        if: steps.ready.outputs.ready == 'true'
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_worker == true }}
          # The last green commit "What changed" found (a push only): the
          # Worker may have changed in a run a newer push cancelled.
          GREEN_BASE: ${{ needs.changes.outputs.base }}
        run: |
          set -u
          if [ "$FORCE" = "true" ]; then
            echo "Asked to redeploy the Worker; deploying it."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE=""
          if [ "$EVENT" = "push" ] && [ -n "$GREEN_BASE" ] && git fetch -q --depth=1 origin "$GREEN_BASE"; then
            BASE="$GREEN_BASE"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -Eq '^0+$'; then
            git fetch -q --depth=1 origin "$BEFORE" && BASE="$BEFORE"
          else
            git fetch -q --deepen=1 origin && BASE="$(git rev-parse --verify -q HEAD~1 || true)"
          fi
          if [ -z "$BASE" ]; then
            echo "No base commit to compare against; deploying the Worker."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE" HEAD -- worker lobby/src/lib shared/text.js shared/sync-protocol.js shared/cloud-crypto.js shared/tonight.js shared/pickup.js shared/clubs.js shared/churchSettings.js shared/clubNight.js shared/schedule.json shared/journeyRemote.js .github/workflows/ci.yml; then
            echo "Nothing the Worker is built from changed since $BASE; its deploy is skipped."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "The Worker's sources changed since $BASE; deploying it."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply the history database's migrations
        # Before the Worker that needs them. Idempotent (wrangler remembers what
        # it applied), so it runs on every Worker deploy rather than guessing
        # whether worker/migrations changed (a change there changes the
        # Worker's own folder, so it deploys too).
        if: steps.ready.outputs.ready == 'true' && steps.worker.outputs.changed == 'true'
        working-directory: worker
        run: npx wrangler d1 migrations apply awana-history --remote
      - name: Deploy the sync Worker
        if: steps.ready.outputs.ready == 'true' && steps.worker.outputs.changed == 'true'
        working-directory: worker
        run: npx wrangler deploy
      - name: Set the Worker's secrets
        if: steps.ready.outputs.ready == 'true' && steps.worker.outputs.changed == 'true'
        working-directory: worker
        env:
          INITIAL_PASSPHRASE: ${{ secrets.SYNC_PASSPHRASE }}
          # Cloud check-in (ROADMAP.md#cloud-check-in): the church's dedicated TwoTimTwo
          # user. Never echoed; the Worker never stores or returns them.
          TWOTIMTWO_USERNAME: ${{ secrets.TWOTIMTWO_USERNAME }}
          TWOTIMTWO_PASSWORD: ${{ secrets.TWOTIMTWO_PASSWORD }}
          TWOTIMTWO_HOST: ${{ secrets.TWOTIMTWO_HOST }}
        run: |
          node -e '
            const names = ["INITIAL_PASSPHRASE",
              "TWOTIMTWO_USERNAME", "TWOTIMTWO_PASSWORD", "TWOTIMTWO_HOST"];
            const out = {};
            for (const n of names) if (process.env[n]) out[n] = process.env[n];
            const missing = names.filter((n) => !out[n]);
            if (missing.length) console.log(`Not set here: ${missing.join(", ")}.`);
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/secrets.json", JSON.stringify(out));
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/unset.txt", missing.join("\n"));
          '
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json" "$RUNNER_TEMP/unset.txt"
      - name: Publish the site
        if: steps.ready.outputs.ready == 'true'
        working-directory: site
        run: |
          WRANGLER=../worker/node_modules/.bin/wrangler
          $WRANGLER pages project create kvbcawana --production-branch main 2>/dev/null || true
          $WRANGLER pages deploy dist --project-name kvbcawana --branch main --commit-dirty=true

