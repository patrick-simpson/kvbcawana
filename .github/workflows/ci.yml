name: CI

# One test run for the whole family. Each app keeps exactly the checks its
# old repo ran; the copies the three used to compare over the network
# (contract and envelope vectors, the brand kit, family.css) are compared
# here directly. Nothing deploys from this repo yet: the apps' own workflows
# sit dormant under their folders (GitHub reads only the root's) until the
# one-site move at awana.kvbchurch.org replaces them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_worker:
        # After adding or changing a Worker secret in GitHub (the TWOTIMTWO_*
        # ones for cloud check-in): the Worker only redeploys, and so only
        # receives its secrets, when this is ticked or its sources changed.
        description: Redeploy the sync Worker and re-send its secrets (drops every screen's socket for a moment)
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same PR replaces its run. On main a run is never
# cancelled: every push to main is followed within minutes by another (the
# release workflows and the nightly bots commit a feed or a lesson and
# dispatch this workflow), and cancelling the run in flight killed its deploy
# job between the Worker and the site, or starved the deploy altogether while
# commits kept landing. The deploy job's own group below keeps main's deploys
# in order, newest pending only.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which slow suites this push can affect. The lobby's (7.5 min, mostly the
  # browser tests) and the printer's (3 min) are skipped only when EVERY
  # changed file is one that suite was checked never to read (owner,
  # 2026-10-11: a Worker fix waited 8 minutes on lobby tests it cannot touch).
  # Anything unknown runs everything: a manual run or a bot's dispatch, no
  # base to compare with, or a change to this file. The fast jobs always run.
  #   lobby   reads only lobby/ (its vitest excludes worker/ and desktop/,
  #           whose lint moved into their own jobs below), plus
  #           journey/public/src/schedule.js and printer/components/Lobby.tsx
  #           (the home page's stepped chips, aboutChips.test.js)
  #   printer reads printer/, plus lobby/worker/src/relay.js
  #           (test-phone-relay), site/build.mjs (test-phone-touch) and
  #           lobby/src/lib/syncSpecs.js (electron-app's device-sync test)
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lobby: ${{ steps.pick.outputs.lobby }}
      printer: ${{ steps.pick.outputs.printer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -u
          base=""
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -Eq '^0+$'; then base="$BEFORE"
          elif [ "$EVENT" = "pull_request" ] && [ -n "$PR_BASE" ]; then base="$PR_BASE"; fi
          files=""
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then files="$(git diff --name-only "$base" HEAD)"; fi
          lobby=true; printer=true
          if [ -n "$base" ] && [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qx '.github/workflows/ci.yml'; then
            lobby=false; printer=false
            while IFS= read -r f; do
              # A note at the top level (ROADMAP.md#cloud-check-in, CLAUDE.md) is read by no
              # suite. (In a case pattern * also matches "/", so this is a test.)
              if [[ "$f" != */* && "$f" == *.md ]]; then continue; fi
              case "$f" in
                journey/public/src/schedule.js) lobby=true ;;  # screenSpecs.test.js reads it
                printer/components/Lobby.tsx) lobby=true ;;  # aboutChips.test.js reads the home page's chips
                lobby/worker/*|lobby/desktop/*|printer/*|journey/*|site/*|.github/workflows/*) ;;
                *) lobby=true ;;
              esac
              case "$f" in
                lobby/worker/src/relay.js|lobby/src/lib/syncSpecs.js|site/build.mjs) printer=true ;;
                lobby/*|journey/*|site/updates/*|.github/workflows/*) ;;
                *) printer=true ;;
              esac
            done <<< "$files"
          fi
          echo "Changed since ${base:-unknown}: $(printf '%s\n' "$files" | grep -c . || true) file(s). Lobby tests: $lobby. Printer tests: $printer."
          echo "lobby=$lobby" >> "$GITHUB_OUTPUT"
          echo "printer=$printer" >> "$GITHUB_OUTPUT"

  copies:
    name: Family copies match
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-mirrors.mjs

  lobby-checks:
    # Lint, typecheck and the vitest suite. Runs beside lobby-e2e (which
    # builds and drives the browser), so the two halves of the old 7.5-minute
    # serial lobby job overlap.
    name: Lobby + projector (lint, types, unit tests)
    needs: changes
    if: needs.changes.outputs.lobby == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lobby
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app
        with:
          lockfile: lobby/package-lock.json
          working-directory: lobby
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

  lobby-e2e:
    name: Lobby + projector (build, browser smoke)
    needs: changes
    if: needs.changes.outputs.lobby == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lobby
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app
        with:
          lockfile: lobby/package-lock.json
          working-directory: lobby
      - name: Build
        run: npm run build
      # Chromium is cached by the version of @playwright/test the lockfile
      # installs (the browser build is tied to it). A hit still needs the OS
      # libraries, which live outside the cache.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium and its system libraries
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries (browser cached)
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: E2E smoke
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lobby-playwright-report
          path: lobby/playwright-report
          retention-days: 7

  worker:
    name: Sync Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lobby
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app
        with:
          lockfile: |
            lobby/package-lock.json
            lobby/worker/package-lock.json
          working-directory: lobby
      - run: npm ci --prefix worker
      # The lobby-checks job's \`eslint .\` covers worker/ too, but it may be skipped.
      - run: npx eslint worker
      - run: npx vitest run --config worker/vitest.config.js

  desktop:
    name: Sound room app (unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lobby
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app
        with:
          lockfile: lobby/package-lock.json
          working-directory: lobby
      # The lobby-checks job's \`eslint .\` covers desktop/ too, but it may be skipped.
      - run: npx eslint desktop
      - run: npx vitest run --config desktop/vitest.config.js

  journey:
    name: Journey kiosk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: journey
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app
        with:
          lockfile: journey/package-lock.json
          working-directory: journey
      - run: node scripts/build-schedule.mjs --check && node --check public/src/schedule.js && node --check public/src/sync.js
      - run: npm test

  printer:
    name: Club Label Printer
    needs: changes
    if: needs.changes.outputs.printer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: printer
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-app
        with:
          lockfile: |
            printer/package-lock.json
            printer/print-server/package-lock.json
          working-directory: printer
      - run: npm ci
        working-directory: printer/print-server
      - run: npm test
      - run: npm run build

  site:
    # site/build.mjs has hard failures (a page that lost the shape /checkin
    # expects, a file over Pages' 25 MiB that is not in the repo, a missing
    # must-have) and the Pages Function has tests. Both used to run only
    # inside the main-only deploy job, after the Worker had already shipped,
    # so a PR never saw them. Here they run on every push and PR, and this is
    # the ONE build: the deploy job publishes the dist this job uploads (with
    # the same SITE_ORIGIN: the repository variable, which the deploy used,
    # else the production address) instead of rebuilding it.
    name: The one site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            lobby/package-lock.json
            printer/package-lock.json
      - name: Install
        run: |
          npm ci --prefix lobby
          npm ci --prefix printer
      - name: Build the site
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://awana.kvbchurch.org' }}
        run: node site/build.mjs
      - name: Test the Pages Function
        run: node --test site/test/*.test.mjs
      # What the deploy job publishes: dist, and the generated list of files
      # too big for Pages (site/functions/journey imports it; it is not
      # committed). Hidden files are included so nothing in dist is dropped.
      - name: Keep the built site for the deploy job
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: |
            site/dist
            site/lib/large-files.generated.js
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    # The site is built first (its failures are the cheap ones), then the
    # sync Worker, then the site is published, once every check above is
    # green. Until CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID exist it
    # stops, green. SITE_ORIGIN (a repository variable) is the site's
    # address, https://awana.kvbchurch.org; a deploy without it fails rather
    # than quietly publishing a site that points at the wrong host.
    name: Deploy to Cloudflare
    # A suite "What changed" skipped is not a failure: !failure() and
    # !cancelled() let the deploy run past it, and still stop on any red job.
    if: ${{ !failure() && !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: [changes, copies, lobby-checks, lobby-e2e, worker, desktop, journey, printer, site]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lobby/worker/package-lock.json
      - name: Check the Cloudflare secrets
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set, so nothing was deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the Worker's packages (wrangler)
        if: steps.ready.outputs.ready == 'true'
        run: npm ci --prefix lobby/worker
      - name: Fetch the site the site job built
        # Built once, by the site job of this same run, with the same
        # SITE_ORIGIN and commit. dist, plus site/lib/large-files.generated.js
        # (the Pages Function imports it), land back where they were built.
        if: steps.ready.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site
      - name: Check the site's origin
        if: steps.ready.outputs.ready == 'true'
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: |
          if [ -z "$SITE_ORIGIN" ]; then
            echo "::error::The SITE_ORIGIN repository variable is not set (https://awana.kvbchurch.org). Nothing was deployed."
            exit 1
          fi
          test -f site/dist/index.html && test -f site/dist/lobby/shared/sync.json && test -f site/lib/large-files.generated.js
          grep -q "\"url\": \"${SITE_ORIGIN%/}/api\"" site/dist/lobby/shared/sync.json || { echo "::error::The built site does not point at $SITE_ORIGIN/api."; exit 1; }
      - name: Did the Worker change?
        # Every deploy of the Worker is a new version, and a new version
        # restarts its Durable Object: every lobby TV, the projector and the
        # Journey kiosk lose their live socket and reconnect. Deploying it on
        # every push (the nightly bots' feed and lesson commits included) did
        # that several times a day for nothing. It deploys only when something
        # it is built from changed: its own folder, the lobby lib files it
        # imports, or this workflow. A push compares against the commit before
        # it; a dispatch (the bots and the release workflows dispatch this
        # right after their own one commit) against the parent; anything
        # unknowable deploys, the safe direction.
        id: worker
        if: steps.ready.outputs.ready == 'true'
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_worker == true }}
        run: |
          set -u
          if [ "$FORCE" = "true" ]; then
            echo "Asked to redeploy the Worker; deploying it."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE=""
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -Eq '^0+$'; then
            git fetch -q --depth=1 origin "$BEFORE" && BASE="$BEFORE"
          else
            git fetch -q --deepen=1 origin && BASE="$(git rev-parse --verify -q HEAD~1 || true)"
          fi
          if [ -z "$BASE" ]; then
            echo "No base commit to compare against; deploying the Worker."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE" HEAD -- lobby/worker lobby/src/lib .github/workflows/ci.yml; then
            echo "Nothing the Worker is built from changed since $BASE; its deploy is skipped."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "The Worker's sources changed since $BASE; deploying it."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the sync Worker
        if: steps.ready.outputs.ready == 'true' && steps.worker.outputs.changed == 'true'
        working-directory: lobby/worker
        run: npx wrangler deploy
      - name: Set the Worker's secrets
        if: steps.ready.outputs.ready == 'true' && steps.worker.outputs.changed == 'true'
        working-directory: lobby/worker
        env:
          PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID }}
          PUSHER_KEY: ${{ secrets.PUSHER_KEY }}
          PUSHER_SECRET: ${{ secrets.PUSHER_SECRET }}
          PUSHER_CLUSTER: ${{ secrets.PUSHER_CLUSTER }}
          INITIAL_PASSPHRASE: ${{ secrets.SYNC_PASSPHRASE }}
          # Cloud check-in (ROADMAP.md#cloud-check-in): the church's dedicated TwoTimTwo
          # user. Never echoed; the Worker never stores or returns them.
          TWOTIMTWO_USERNAME: ${{ secrets.TWOTIMTWO_USERNAME }}
          TWOTIMTWO_PASSWORD: ${{ secrets.TWOTIMTWO_PASSWORD }}
          TWOTIMTWO_HOST: ${{ secrets.TWOTIMTWO_HOST }}
        run: |
          node -e '
            const names = ["PUSHER_APP_ID", "PUSHER_KEY", "PUSHER_SECRET", "PUSHER_CLUSTER", "INITIAL_PASSPHRASE",
              "TWOTIMTWO_USERNAME", "TWOTIMTWO_PASSWORD", "TWOTIMTWO_HOST"];
            const out = {};
            for (const n of names) if (process.env[n]) out[n] = process.env[n];
            const missing = names.filter((n) => !out[n]);
            if (missing.length) console.log(`Not set here: ${missing.join(", ")}.`);
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/secrets.json", JSON.stringify(out));
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/unset.txt", missing.join("\n"));
          '
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          # Pusher is retired (2026-10-03): a PUSHER_* secret deleted here is
          # deleted from the Worker too, so it stops sending to Pusher. Only
          # those: INITIAL_PASSPHRASE counts once and is never removed.
          grep '^PUSHER_' "$RUNNER_TEMP/unset.txt" | while read -r name; do
            npx wrangler secret delete "$name" </dev/null >/dev/null 2>&1 && echo "Removed $name from the Worker." || true
          done
          rm -f "$RUNNER_TEMP/secrets.json" "$RUNNER_TEMP/unset.txt"
      - name: Publish the site
        if: steps.ready.outputs.ready == 'true'
        working-directory: site
        run: |
          WRANGLER=../lobby/worker/node_modules/.bin/wrangler
          $WRANGLER pages project create kvbcawana --production-branch main 2>/dev/null || true
          $WRANGLER pages deploy dist --project-name kvbcawana --branch main --commit-dirty=true
