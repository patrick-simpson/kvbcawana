<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cast · Kennebec Valley Baptist Church</title>
<link rel="preload" href="../church/fonts/Jost-Variable.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="../church/church.css">
<style>
  /* The Cast screen (owner 2026-11-08; worker/src/routes.md 10.18): what KVBC Awana
     shows on the lobby TV while Cast is on. Waiting = the house slide (the church's logo
     on cream); asked for = the code, white on black; anything a presenter puts up = on
     black, edge to edge. Sizes in --u, 1% of the
     largest 16:9 box in the window, so 720p, 1080p and 4K draw the same picture. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: #000; color: var(--charcoal); font-family: var(--body); -webkit-font-smoothing: antialiased; cursor: none; --u: min(1vw, 1.7778vh); }
  [hidden] { display: none !important; }
  .layer { position: fixed; inset: 0; }

  /* ── waiting: the code ── */
  /* The code screen: white on black (owner 2026-11-08: "the present on this screen should be
     black background white text/qr"). KVBC Awana's Settings window note stays on cream. */
  .card { --c-bg: #000; --c-text: #FFFFFF; --c-muted: rgba(255, 255, 255, .7); --c-rule: rgba(255, 255, 255, .2); background: var(--c-bg); color: var(--c-text); display: grid; grid-template-rows: auto 1fr auto; padding: 6.2vh 7vw 6.6vh; transition: opacity var(--t-slow) var(--ease-in-out), transform var(--t-slow) var(--ease-in-out); }
  .card.is-away { opacity: 0; transform: scale(.985); }
  .card .logo { width: calc(26 * var(--u)); min-width: 260px; height: auto; display: block; }
  .card .middle { align-self: center; display: grid; grid-template-columns: 1fr auto; gap: calc(5 * var(--u)); align-items: center; }
  .middle > div { min-width: 0; }
  .qr { margin: 0; text-align: center; }
  .qr canvas { display: block; width: calc(20 * var(--u)); height: calc(20 * var(--u)); image-rendering: pixelated; }
  .qr figcaption { margin-top: calc(1 * var(--u)); font: 500 calc(1.6 * var(--u))/1.3 var(--heading); letter-spacing: .14em; text-transform: uppercase; color: var(--c-muted); }
  .card .foot b { font-weight: 700; color: var(--c-text); }
  /* The code and QR stay hidden until someone clicks the screen (owner 2026-11-08: "the pin
     should not show up by default until it's clicked on, same with the QR code"). */
  .card.code-hidden .code, .card.code-hidden .qr { display: none !important; }
  .card.code-hidden { cursor: pointer; }

  /* ── waiting: the house slide (owner 2026-11-11) ──
     With nothing up and the code not asked for, the TV shows the church's logo on its cream,
     ONE optional line set at the lobby computer's desk, and a quiet hint at the foot. It
     lies over the code screen and steps away (opacity) when the code is asked for. */
  .house { background: var(--cream); color: var(--charcoal); display: grid; grid-template-rows: 1fr auto; justify-items: center; padding: 6.2vh 7vw 5.4vh; cursor: pointer; transition: opacity var(--t-slow) var(--ease-in-out); }
  .house.is-away { opacity: 0; pointer-events: none; }
  .house-mid { align-self: center; display: grid; justify-items: center; text-align: center; }
  .house-logo { display: block; width: calc(58 * var(--u)); height: auto; }
  .house-line { margin: calc(4.6 * var(--u)) 0 0; max-width: calc(78 * var(--u)); font: 400 calc(4.4 * var(--u))/1.2 var(--heading); letter-spacing: .01em; text-wrap: balance; overflow-wrap: anywhere; }
  .house-line::before { content: ''; display: block; width: calc(7 * var(--u)); height: max(2px, calc(.16 * var(--u))); margin: 0 auto calc(3.6 * var(--u)); background: var(--tan); }
  .house-hint { margin: 0; font: 500 calc(1.25 * var(--u))/1 var(--heading); letter-spacing: .18em; text-transform: uppercase; color: #8C7760; }
  .card h1 { font: 500 calc(5 * var(--u))/1.05 var(--heading); letter-spacing: -.01em; margin: 0; }
  .card .go { font: 400 calc(2.5 * var(--u))/1.4 var(--body); color: var(--c-muted); margin: calc(1.6 * var(--u)) 0 0; }
  .card .go b { font-weight: 700; color: var(--c-text); }
  .code { display: flex; gap: calc(3.6 * var(--u)); margin: calc(3.4 * var(--u)) 0 0; font: 400 calc(14.5 * var(--u))/.9 var(--heading); letter-spacing: .06em; color: var(--c-text); font-variant-numeric: tabular-nums; }
  .code.is-empty { color: var(--c-rule); }
  .card .foot { display: flex; align-items: center; gap: calc(1.2 * var(--u)); border-top: 1px solid var(--c-rule); padding-top: calc(1.8 * var(--u)); font: 400 calc(1.7 * var(--u))/1.4 var(--body); color: var(--c-muted); }
  .card .foot::before { content: ''; width: calc(.9 * var(--u)); height: calc(.9 * var(--u)); border-radius: 50%; background: var(--tan); flex: none; }

  /* configure mode and the signed-out card: calm, on the same cream, no code */
  .card.calm h1 { font-size: calc(3.6 * var(--u)); max-width: 30ch; }
  .card.calm .go { max-width: 48ch; }
  body.configure { cursor: auto; overflow: auto; background: var(--cream); --u: min(1.6vw, 2.4vh); }
  body.configure .card { --c-bg: var(--cream); --c-text: var(--charcoal); --c-muted: var(--muted); --c-rule: var(--rule); }
  body.configure .card .logo { content: url('../church/kvbc-logo.png'); }
  body.configure .card { position: static; min-height: 100vh; padding: 32px 28px; }

  /* ── something up ── */
  #show { background: #000; opacity: 0; transition: opacity var(--t-slow) var(--ease-in-out); }
  #show.is-in { opacity: 1; }
  #show img, #show canvas, #show video { position: absolute; inset: 0; margin: auto; max-width: 100%; max-height: 100%; }
  #show img { width: 100%; height: 100%; object-fit: contain; }
  #show video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #show iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #show .fb-box { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #show .fb-box iframe { position: static; }
  .text { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 9vh 9vw; overflow: hidden; }
  .text--page { background: var(--cream); color: var(--charcoal); }
  .text--board { background: #1C1915; color: #F6F2EA; }
  .text .heading { font: 500 calc(2.4 * var(--u))/1.2 var(--heading); letter-spacing: .14em; text-transform: uppercase; color: var(--tan); margin: 0 0 calc(2.4 * var(--u)); flex: none; }
  .text--page .heading { color: #8C7760; }
  .text .words { font: 400 calc(var(--words-size, 6) * var(--u))/1.3 var(--heading); margin: 0; white-space: pre-line; flex: none; }
  .text--page .words { border-left: 3px solid var(--tan); padding-left: calc(3 * var(--u)); }
  /* A countdown and the clock (owner 2026-11-11): the house slide's cream, big Jost figures
     in fixed cells (they never shuffle as the digits change), the church's logo small at the foot. */
  .face { position: absolute; inset: 0; background: var(--cream); color: var(--charcoal); display: grid; grid-template-rows: 1fr auto; justify-items: center; padding: 6.2vh 7vw 5.4vh; }
  .face-mid { align-self: center; text-align: center; }
  .face-title { margin: 0 0 calc(1.6 * var(--u)); max-width: calc(80 * var(--u)); font: 500 calc(2.6 * var(--u))/1.25 var(--heading); letter-spacing: .16em; text-transform: uppercase; color: #8C7760; text-wrap: balance; }
  .face-figures { margin: 0; display: flex; justify-content: center; align-items: baseline; font: 400 calc(27 * var(--u))/1 var(--heading); letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .face--clock .face-figures { font-size: calc(22 * var(--u)); }
  .face-figures span { display: inline-block; width: .62em; text-align: center; }
  .face-figures .sep { width: .3em; }
  .face-figures .ampm { width: auto; margin-left: .22em; font-size: .3em; letter-spacing: .04em; }
  .face-date { margin: calc(2.2 * var(--u)) 0 0; font: 400 calc(3 * var(--u))/1.2 var(--heading); color: var(--muted); }
  /* (Over "#show img", which stretches a presenter's picture to the whole screen.) */
  #show .face-logo { position: static; display: block; width: calc(18 * var(--u)); height: auto; margin: 0; }
  /* Scripture (King James): the cream page, the reference in Jost caps above, the words in
     Almarai as big as fit, verse numbers small and tan, the church's logo and the page at the foot. */
  .verse { position: absolute; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--cream); color: var(--charcoal); padding: 8.4vh 9vw 5.6vh; overflow: hidden; }
  .verse-ref { margin: 0; font: 500 calc(2.4 * var(--u))/1.2 var(--heading); letter-spacing: .16em; text-transform: uppercase; color: #8C7760; }
  .verse-ref::after { content: ''; display: block; width: calc(6 * var(--u)); height: max(2px, calc(.16 * var(--u))); margin-top: calc(2.4 * var(--u)); background: var(--tan); }
  .verse-words { display: grid; align-content: safe center; min-height: 0; overflow: hidden; margin: calc(2.4 * var(--u)) 0; max-width: calc(84 * var(--u)); font: 400 calc(var(--verse-size, 5) * var(--u))/1.42 var(--body); }
  .verse-words > span { text-wrap: pretty; }
  .verse-words .vn { font: 500 .5em/1 var(--heading); color: #8C7760; vertical-align: .72em; margin-right: .22em; letter-spacing: .02em; }
  .verse-foot { display: flex; align-items: center; justify-content: space-between; }
  #show .verse-logo { position: static; display: block; width: calc(14 * var(--u)); height: auto; margin: 0; }
  .verse-page { margin: 0; font: 500 calc(1.7 * var(--u))/1 var(--heading); letter-spacing: .08em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 10vw; font: 400 calc(2.4 * var(--u))/1.4 var(--heading); color: #CFC4B5; }
  /* Black (owner 2026-11-11, the presenter's Black button): pure black over whatever is up,
     no words. What is under it stays as it is and comes back with Show again. */
  #black { background: #000; z-index: 5; }
  .status small { display: block; margin-top: calc(1 * var(--u)); font: 400 calc(1.6 * var(--u))/1.4 var(--body); color: #8F8577; }

  /* ── Motion (church.css's language; nothing moves with "reduce motion" on) ── */
  @media (prefers-reduced-motion: no-preference) {
    /* The code card arrives line by line. */
    .card > .logo { animation: cast-rise var(--t-slow) var(--ease-out) both; }
    .card .middle h1 { animation: cast-rise var(--t-slow) var(--ease-out) 90ms both; }
    .card .middle .go { animation: cast-rise var(--t-slow) var(--ease-out) 170ms both; }
    /* The house slide settles in: the logo, then the line, then the hint. */
    .house:not(.is-away) .house-logo { animation: cast-rise var(--t-slow) var(--ease-out) both; }
    .house:not(.is-away) .house-line { animation: cast-rise var(--t-slow) var(--ease-out) 140ms both; }
    .house:not(.is-away) .house-hint { animation: cast-fade var(--t-slow) var(--ease-out) 420ms both; }
    .card > .foot { animation: cast-fade var(--t-slow) var(--ease-out) 380ms both; }
    /* Asked for: the digits rise one after another, the QR settles in beside them. */
    .card:not(.code-hidden) .code > span { animation: cast-rise var(--t-slow) var(--ease-out) both; }
    .card:not(.code-hidden) .code > span + span { animation-delay: 90ms; }
    .card:not(.code-hidden) .qr { animation: cast-pop var(--t-slow) var(--ease-out) 160ms both; }
    /* Whatever goes up settles in from a whisper larger as the black fades up. */
    #show.is-in > :not(.status) { animation: cast-settle 900ms var(--ease-out) both; }
    #show.is-in .text .heading { animation: cast-rise var(--t-slow) var(--ease-out) 120ms both; }
    #show.is-in .text .words { animation: cast-rise var(--t-slow) var(--ease-out) 220ms both; }
    /* A slide turning: the next page fades in over the last. */
    #show canvas.is-next { animation: cast-fade 380ms var(--ease-in-out) both; }
    /* Waiting (connecting, loading): a calm bar breathing under the words. */
    .status { animation: cast-fade var(--t-base) var(--ease-out) both; }
    .status.working::after { content: ''; display: block; width: calc(14 * var(--u)); height: 3px; margin: calc(2.4 * var(--u)) auto 0; border-radius: 3px; background: #CFC4B5; transform-origin: center; animation: cast-breathe 1.4s var(--ease-in-out) infinite alternate; }
    @keyframes cast-breathe { from { transform: scaleX(.18); opacity: .35; } to { transform: scaleX(1); opacity: .9; } }
  }
  .status.working { flex-direction: column; }
</style>
</head>
<body>
  <!-- Waiting: the code (or, signed out / configure mode, a calm note) -->
  <section class="layer card code-hidden" id="card">
    <img class="logo" src="../church/kvbc-logo-white.png" alt="Kennebec Valley Baptist Church" width="1302" height="277">
    <div class="middle">
      <div>
        <h1 id="card-title">Present on this screen</h1>
        <p class="go" id="card-go">Go to <b id="card-addr">cast.kvbchurch.org</b> and enter</p>
        <p class="code is-empty" id="code" aria-label="Code"><span id="code-a">···</span><span id="code-b">···</span></p>
      </div>
      <figure class="qr" id="qr" hidden><canvas id="qr-canvas" aria-label="QR code: open the Cast page with this code"></canvas><figcaption>Or scan</figcaption></figure>
    </div>
    <p class="foot" id="card-foot"><span>Casting a laptop? Join the <b>KVBC_Guest</b> Wi-Fi first. Phones can present on any connection.</span></p>
  </section>
  <!-- Waiting, the code not asked for: the house slide (the logo, one optional line) -->
  <section class="layer house is-away" id="house">
    <div class="house-mid">
      <img class="house-logo" src="../church/kvbc-logo.png" alt="Kennebec Valley Baptist Church" width="1302" height="277">
      <p class="house-line" id="house-line" hidden></p>
    </div>
    <p class="house-hint">Click for the Cast code</p>
  </section>
  <!-- Something a presenter put up -->
  <section class="layer" id="show" hidden></section>
  <!-- Black: over everything, nothing on it -->
  <div class="layer" id="black" hidden></div>
  <script type="module" src="screen.js"></script>
</body>
</html>
