<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vote Tally · KVBC Awana</title>
<link rel="stylesheet" href="/lobby/shared/brand/fonts.css">
<style>
  :root {
    --navy: #13294B;
    --navy-deep: #0B1A33;
    --gold: #F2B33D;
    --gold-deep: #C98A12;
    --paper: #FFFFFF;
    --ink: #1B1F2A;
    --hot: #F15A28;
    --muted: #5A6478;
    --line: #DDE3EC;
    --bg: #F4F6FA;
    --shadow: #0B1A33;
    --bar: #13294B;
    --accent-text: #13294B;
    --on-gold: #13294B;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --navy: #13294B;
      --navy-deep: #060D1A;
      --gold: #F2B33D;
      --gold-deep: #C98A12;
      --paper: #14213A;
      --ink: #EEF2F8;
      --hot: #F15A28;
      --muted: #A4AFC4;
      --line: #2A3A57;
      --bg: #0B1220;
      --shadow: #000000;
      --bar: #F2B33D;
      --accent-text: #F2B33D;
      --on-gold: #13294B;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --navy: #13294B;
    --navy-deep: #060D1A;
    --gold: #F2B33D;
    --gold-deep: #C98A12;
    --paper: #14213A;
    --ink: #EEF2F8;
    --hot: #F15A28;
    --muted: #A4AFC4;
    --line: #2A3A57;
    --bg: #0B1220;
    --shadow: #000000;
    --bar: #F2B33D;
    --accent-text: #F2B33D;
    --on-gold: #13294B;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Figtree, system-ui, sans-serif;
    font-size: 1rem;
    line-height: 1.3;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  h1, h2 { margin: 0; font-weight: 400; }
  .eyebrow {
    font-family: "Londrina Solid", "Arial Narrow", sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 1rem;
    color: var(--accent-text);
  }
  button {
    min-height: 44px;
    padding: 0 16px;
    border: 2px solid var(--ink);
    border-radius: 12px;
    background: var(--paper);
    color: var(--ink);
    font-family: Figtree, system-ui, sans-serif;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--shadow);
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
  button:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; transform: none; }
  button:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }

  /* One phone screen, never a scroll: header, two divisions sharing the rest, the undo bar. */
  .wrap {
    box-sizing: border-box;
    height: 100vh;
    height: 100svh;
    max-width: 560px;
    margin: 0 auto;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: 10px;
    padding-top: max(10px, env(safe-area-inset-top, 0px));
    padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    overflow: hidden;
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .top h1 {
    font-family: "Paytone One", "Arial Black", sans-serif;
    font-size: 1.45rem;
    line-height: 1;
    text-transform: uppercase;
    margin-top: 1px;
  }
  .status {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.8rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status .linkish { color: var(--muted); font-size: 0.8rem; }
  .ballots {
    flex: none;
    text-align: center;
    padding: 4px 12px 6px;
    background: var(--navy);
    color: #fff;
    border-radius: 12px;
    box-shadow: 3px 3px 0 var(--gold);
  }
  .ballots .eyebrow { display: block; color: var(--gold); font-size: 0.8rem; line-height: 1.1; }
  .ballots strong {
    display: block;
    font-family: "Paytone One", "Arial Black", sans-serif;
    font-size: 1.6rem;
    line-height: 1;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
  }

  .divisions {
    display: grid;
    grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
    gap: 10px;
    min-height: 0;
  }
  .division {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    gap: 6px;
    min-height: 0;
  }
  .div-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    padding: 0 2px;
  }
  .div-head h2 {
    font-family: "Paytone One", "Arial Black", sans-serif;
    font-size: 1.05rem;
    text-transform: uppercase;
    color: var(--accent-text);
  }
  .div-total { margin: 0; color: var(--muted); font-weight: 700; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
  .row {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    min-height: 0;
  }

  .poster {
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    gap: 6px;
    min-height: 0;
    min-width: 0;
  }
  /* The whole tile is the +1. */
  .poster .plus {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-height: 0;
    padding: 6px 6px 10px;
    border: 2px solid var(--shadow);
    border-radius: 14px;
    background: var(--paper);
    color: var(--ink);
    overflow: hidden;
  }
  .poster.leading .plus { background: var(--gold); color: var(--on-gold); }
  .num {
    font-family: "Londrina Solid", "Arial Narrow", sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 0.95rem;
    font-weight: 400;
    line-height: 1;
    opacity: 0.8;
  }
  .count {
    display: inline-block;
    font-family: "Paytone One", "Arial Black", sans-serif;
    font-weight: 400;
    font-size: clamp(2rem, min(12vw, 7.2svh), 3.4rem);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .pct { font-size: 0.85rem; font-weight: 700; opacity: 0.75; font-variant-numeric: tabular-nums; }
  .bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 6px;
    background: var(--line);
  }
  .poster.leading .bar { background: rgba(19, 41, 75, 0.2); }
  .bar span {
    display: block;
    height: 100%;
    width: 0;
    background: var(--bar);
    transition: width 0.25s ease-out;
  }
  .poster.leading .bar span { background: var(--navy); }
  .pill {
    position: absolute;
    top: 5px; right: 5px;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--navy);
    color: var(--gold);
    font-family: "Londrina Solid", "Arial Narrow", sans-serif;
    font-size: 0.7rem;
    font-weight: 400;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1.3;
  }
  .pill[hidden] { display: none; }
  .poster .minus {
    min-height: 34px;
    padding: 0;
    background: transparent;
    box-shadow: none;
    border: 2px solid var(--line);
    color: var(--muted);
    font-size: 0.95rem;
  }
  .poster .minus:active { transform: none; background: var(--line); }

  .actions { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
  .actions button { min-height: 48px; }
  #undo { background: var(--navy); color: #fff; border-color: var(--shadow); }
  #reset { color: var(--muted); border-color: var(--line); box-shadow: none; }
  #reset.armed { background: var(--hot); color: #fff; border-color: var(--hot); }

  /* Short phones (an SE, a browser with its bars out): tighter, still no scroll. */
  @media (max-height: 640px) {
    .wrap { gap: 6px; }
    .divisions { gap: 6px; }
    .row { gap: 6px; }
    .poster { gap: 4px; }
    .poster .minus { min-height: 30px; }
    .actions button { min-height: 42px; }
    .top h1 { font-size: 1.2rem; }
    .pct { display: none; }
  }

  @keyframes bump {
    0% { transform: scale(1); }
    35% { transform: scale(1.14); }
    100% { transform: scale(1); }
  }
  .count.bump { animation: bump 0.28s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    .bar span { transition: none; }
    .count.bump { animation: none; }
  }
</style>

<style>
  /* Kit faces (shared/brand/fonts.css); Figtree's variable file like the letterhead tool. */
  @font-face { font-family: 'Figtree'; font-weight: 300 900; src: url('/lobby/shared/brand/fonts/figtree-latin-wght-normal.woff2') format('woff2'); }
  [hidden] { display: none !important; }
  body { margin: 0; }
  .linkish { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; font: inherit; cursor: pointer; box-shadow: none; min-height: 0; }
  #signin { max-width: 440px; margin: 48px auto; padding: 28px; background: var(--paper); color: var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--shadow); }
  #signin h1 { margin: 0 0 6px; font: 400 28px/1.1 "Paytone One", "Arial Black", sans-serif; }
  #signin .eyebrow { margin-bottom: 4px; }
  #signin input { width: 100%; box-sizing: border-box; font: inherit; padding: 12px; border: 2px solid var(--navy); border-radius: 10px; margin: 12px 0; background: var(--paper); color: var(--ink); }
  #signin .note { min-height: 1.5em; font-size: 14px; color: var(--hot); }
  #signin button[type=submit] { width: 100%; min-height: 52px; background: var(--gold); color: var(--on-gold); border-color: var(--shadow); font: 400 1.2rem "Paytone One", "Arial Black", sans-serif; }
  .signin-wrap:has(#signin[hidden]) { display: none; }
  .signin-wrap { padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
</style>
</head>
<body>
<div class="signin-wrap">
  <form id="signin" hidden autocomplete="off">
    <div class="eyebrow">DEFEND POSTER CONTEST</div>
    <h1>Vote Tally</h1>
    <p>Sign in with the church passphrase. Every device signed in counts into the same totals.</p>
    <label for="passphrase" class="eyebrow">Passphrase</label>
    <input id="passphrase" type="password" autocomplete="current-password" required>
    <button type="submit" id="signin-btn" class="plus">Sign in</button>
    <p class="note" id="signin-note" role="status"></p>
  </form>
</div>
<div class="wrap" id="tally" hidden>
  <header class="top">
    <div style="min-width:0">
      <div class="eyebrow">Defend poster contest</div>
      <h1>Vote tally</h1>
      <p class="status"><span id="saved-label">Connecting…</span> · <button type="button" id="signout" class="linkish">Sign out</button></p>
    </div>
    <div class="ballots" aria-live="polite"><span class="eyebrow">Ballots</span><strong id="ballots">0</strong></div>
  </header>

  <main class="divisions">
    <section class="division" aria-labelledby="h-o">
      <div class="div-head">
        <h2 id="h-o">Older Kids</h2>
        <p class="div-total" id="total-o">0 votes</p>
      </div>
      <div class="row">
      <article class="poster" data-div="o" data-i="0">
        <button type="button" class="plus" aria-label="Add one vote to Older Kids, Poster 1">
          <span class="pill" hidden></span>
          <span class="num">Poster 1</span>
          <span class="count">0</span>
          <span class="pct">0%</span>
          <span class="bar"><span></span></span>
        </button>
        <button type="button" class="minus" aria-label="Take one vote from Older Kids, Poster 1">&minus;1</button>
      </article>
      <article class="poster" data-div="o" data-i="1">
        <button type="button" class="plus" aria-label="Add one vote to Older Kids, Poster 2">
          <span class="pill" hidden></span>
          <span class="num">Poster 2</span>
          <span class="count">0</span>
          <span class="pct">0%</span>
          <span class="bar"><span></span></span>
        </button>
        <button type="button" class="minus" aria-label="Take one vote from Older Kids, Poster 2">&minus;1</button>
      </article>
      <article class="poster" data-div="o" data-i="2">
        <button type="button" class="plus" aria-label="Add one vote to Older Kids, Poster 3">
          <span class="pill" hidden></span>
          <span class="num">Poster 3</span>
          <span class="count">0</span>
          <span class="pct">0%</span>
          <span class="bar"><span></span></span>
        </button>
        <button type="button" class="minus" aria-label="Take one vote from Older Kids, Poster 3">&minus;1</button>
      </article>
      </div>
    </section>

    <section class="division" aria-labelledby="h-y">
      <div class="div-head">
        <h2 id="h-y">Younger Kids</h2>
        <p class="div-total" id="total-y">0 votes</p>
      </div>
      <div class="row">
      <article class="poster" data-div="y" data-i="0">
        <button type="button" class="plus" aria-label="Add one vote to Younger Kids, Poster 1">
          <span class="pill" hidden></span>
          <span class="num">Poster 1</span>
          <span class="count">0</span>
          <span class="pct">0%</span>
          <span class="bar"><span></span></span>
        </button>
        <button type="button" class="minus" aria-label="Take one vote from Younger Kids, Poster 1">&minus;1</button>
      </article>
      <article class="poster" data-div="y" data-i="1">
        <button type="button" class="plus" aria-label="Add one vote to Younger Kids, Poster 2">
          <span class="pill" hidden></span>
          <span class="num">Poster 2</span>
          <span class="count">0</span>
          <span class="pct">0%</span>
          <span class="bar"><span></span></span>
        </button>
        <button type="button" class="minus" aria-label="Take one vote from Younger Kids, Poster 2">&minus;1</button>
      </article>
      <article class="poster" data-div="y" data-i="2">
        <button type="button" class="plus" aria-label="Add one vote to Younger Kids, Poster 3">
          <span class="pill" hidden></span>
          <span class="num">Poster 3</span>
          <span class="count">0</span>
          <span class="pct">0%</span>
          <span class="bar"><span></span></span>
        </button>
        <button type="button" class="minus" aria-label="Take one vote from Younger Kids, Poster 3">&minus;1</button>
      </article>
      </div>
    </section>
  </main>

  <div class="actions">
    <button type="button" id="undo">Undo last tap</button>
    <button type="button" id="reset">Reset all</button>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
