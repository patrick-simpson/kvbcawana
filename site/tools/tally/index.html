<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vote Tally · Archived</title>
<link rel="stylesheet" href="/lobby/shared/brand/fonts.css">
<!-- The poster contest vote tally (owner 2026-11-04), ARCHIVED 2026-11-05 (owner: "make it
     so that the page doesn't use any resources"): a static note, no script, no request to
     the sync service. The counts stay in the Worker's storage (tally:poster, routes.md 10.15). -->
<style>
  :root { --navy: #13294B; --gold: #F2B33D; --paper: #FFFFFF; --ink: #1B1F2A; --bg: #F4F6FA; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #14213A; --ink: #EEF2F8; --bg: #0B1220; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --paper: #14213A; --ink: #EEF2F8; --bg: #0B1220; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 400 1.05rem/1.5 'Figtree', system-ui, sans-serif; }
  main { max-width: 420px; padding: 24px 22px; border-radius: 18px; background: var(--paper); border: 3px solid var(--navy); box-shadow: 6px 6px 0 var(--gold); text-align: center; }
  h1 { margin: 0 0 8px; font: 400 2rem/1.05 'Paytone One', system-ui, sans-serif; }
  p { margin: 8px 0 0; }
  a { color: inherit; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>Voting is closed</h1>
  <p>The poster contest is over, so this tally is archived.</p>
  <p><a href="/links/">Back to the links page</a></p>
</main>
</body>
</html>
