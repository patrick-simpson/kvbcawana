<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>KVBC Check-in Settings</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f8fafc; margin: 0; padding: 32px; color: #1e293b; }
    .card { max-width: 480px; margin: 0 auto; background: white; border: 1px solid #e2e8f0; border-radius: 10px; padding: 24px; }
    h2 { margin: 0 0 8px 0; font-size: 20px; }
    p { font-size: 13px; color: #475569; line-height: 1.5; margin: 0 0 16px 0; }
    .btn { display: inline-block; padding: 9px 20px; border-radius: 6px; font-size: 13px; font-weight: 500; background: #2563eb; color: white; text-decoration: none; }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <!-- Every setting lives on the print dashboard (6.26.0): the printer, the
       sync service, the display key. Step Up Night and Awana Store Night are
       on the panel on the check-in page itself. This page only points there. -->
  <div class="card">
    <h2>KVBC Check-in</h2>
    <p>
      All settings are on the print dashboard: which printer the name tags print on, the backup
      printer, the sync service and everything else. Step Up Night and Awana Store Night are switched
      on the panel on the TwoTimTwo check-in page.
    </p>
    <a class="btn" href="http://localhost:3456/#settings" target="_blank" rel="noopener">Open the print dashboard</a>
  </div>
</body>
</html>
