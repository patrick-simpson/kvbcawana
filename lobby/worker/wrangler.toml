# The Awana sync service. Deployed by the root .github/workflows/ci.yml; its
# secrets (INITIAL_PASSPHRASE, and TWOTIMTWO_USERNAME /
# TWOTIMTWO_PASSWORD / TWOTIMTWO_HOST for cloud check-in) are set by that
# workflow from the repo's GitHub secrets.
name = "awana-sync"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Cloud check-in (ROADMAP.md#cloud-check-in). "shadow" is phase 1: the report watcher
# reads TwoTimTwo's report every 30 s on club nights (all the Worker's reads share one
# 15 s clock while the laptop's extension tab still reads, src/readbudget.js) and
# publishes nothing; it stays
# idle until the TWOTIMTWO_* secrets exist. "off" stops it.
[vars]
CLOUD_CHECKIN = "shadow"
# Online check-in (ROADMAP.md#online-check-in). Both ON since 2026-10-12 (owner:
# first live night Wednesday 10/14, the laptop on KVBC Awana 9.2.0 as the one
# print station, the extension tab open as the backup; the station's
# printedTonightFor() keeps a child the extension also prints to one label).
# "off" puts either back as it was:
#   CLOUD_PRINT      "on": a child the watcher finds on TwoTimTwo's report (checked
#                    in on TwoTimTwo's own page) gets a print job, sealed to the
#                    stations in the Worker. Stations lease it, so turn it on only
#                    when the extension no longer prints the same child.
#   SINGLE_PUBLISHER "on": the Worker is the one publisher: it publishes the tally,
#                    the ticker and the still-here list from its own state (the shared
#                    count), drops the laptop's frames (POST /v1/publish answers dropped)
#                    and lets only a station's greeting for a print job through (one per
#                    job). It then keeps tonight's first names + clubs, sealed, until the
#                    window closes (routes.md section 8). Turn it on only on the shadow
#                    night, with the station running.
#   YM_CHECKOUT      "on": the Worker does the youth check-out (src/ymcheckout.js): on
#                    club nights from 7:15 pm to midnight every Trek and Journey child
#                    still checked in is checked out on TwoTimTwo, one post every 15 s,
#                    3 tries each. A computer that is the Worker's print station tells
#                    its extension to stop its own sweep, so turn this on before (or
#                    with) the station, or nobody checks them out.
CLOUD_PRINT = "on"
SINGLE_PUBLISHER = "on"
# ON with KVBC Awana 9.2.1 (owner, 2026-10-12: automatic check-outs via the Worker).
YM_CHECKOUT = "on"
# Stored switches override these defaults (src/routes.md 10.2): CLOUD_PRINT,
# SINGLE_PUBLISHER and YM_CHECKOUT above, and the safety switches CHURCH_SETTINGS,
# NOTICES and CHANGE_LOG (default "on" when unset), are flipped at runtime from
# awana.kvbchurch.org/settings; "Back to default" there returns a switch to the
# value here. SWITCHES_STORED = "off" is the deploy kill: stored values are ignored
# (these defaults only) and the settings page cannot flip anything.
SWITCHES_STORED = "on"
# Passphrase v2 migration (src/routes.md section 1). "on": clients that still send
# the passphrase itself keep signing in (and the first v2 sign-in upgrades the
# stored verifier). Set "off" once auth:legacyLastAt is old (every screen, the app
# and the print server are on v2); old-protocol logins then answer 401 legacy-off
# and the old hash is deleted at the next v2 sign-in.
AUTH_LEGACY = "on"

[[durable_objects.bindings]]
name = "SYNC"
class_name = "SyncStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncStore"]

# Online check-in history (ROADMAP.md#online-check-in): a FREE Cloudflare D1
# database, binding HISTORY_DB, holding only sealed rows and plaintext counts
# (migrations/). Created by the owner on 2026-10-12 (`wrangler d1 create
# awana-history`; the id is not a secret). ci.yml's deploy job applies the
# migrations before every Worker deploy (`wrangler d1 migrations apply
# awana-history --remote`, idempotent). Code still treats a missing
# env.HISTORY_DB as "history is off", never an error.
[[d1_databases]]
binding = "HISTORY_DB"
database_name = "awana-history"
database_id = "893de8eb-13cf-4187-8ea2-eab652735acf"
migrations_dir = "migrations"

# Read the church calendar every six hours (UTC), so it is fresh without
# anyone pressing Refresh.
[triggers]
crons = ["23 */6 * * *"]
