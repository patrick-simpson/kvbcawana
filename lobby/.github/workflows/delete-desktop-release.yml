name: Delete desktop release

# Removes a stray or broken Awana Lobby Display release AND its tag. Do it
# promptly: installed apps update from whichever release GitHub marks Latest
# (the most recently published one, not the highest version).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact tag to delete, e.g. desktop-v1.0.1'
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
            echo "Deleted release and tag $TAG"
          elif git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null; then
            git push origin --delete "refs/tags/$TAG"
            echo "No release; deleted tag $TAG"
          else
            echo "Nothing named $TAG"
          fi
