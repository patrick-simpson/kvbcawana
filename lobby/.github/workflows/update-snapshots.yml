name: Update visual-regression baselines

# Manual-only: regenerate the e2e screenshot baselines on the same
# Ubuntu runner CI uses, and commit them back. Run this after an
# intentional visual change makes the `visual` project fail in CI.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Regenerate baselines
        run: npm run e2e:update

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/__screenshots__
          git diff --cached --quiet && echo "No baseline changes." && exit 0
          git commit -m "chore: regenerate visual-regression baselines"
          git push
