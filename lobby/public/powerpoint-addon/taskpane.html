<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Awana Slideshow</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            background: #0a0e1a;
            color: #fff;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .setting {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        label {
            font-size: 12px;
            color: #aaa;
            font-weight: 600;
        }
        input {
            padding: 8px;
            border: 1px solid #333;
            background: #1a1f3a;
            color: #fff;
            border-radius: 6px;
            font-size: 13px;
        }
        input:focus {
            outline: 2px solid #FFD54F;
        }
        button {
            padding: 10px;
            background: #FFD54F;
            color: #1a1f3a;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover {
            background: #FFE082;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
            color: #ccc;
        }
        .status {
            font-size: 12px;
            padding: 8px;
            border-radius: 4px;
            margin-top: 8px;
        }
        .status.connecting {
            background: rgba(255, 179, 0, 0.2);
            color: #FFB300;
        }
        .status.connected {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
        }
        .status.error {
            background: rgba(229, 57, 53, 0.2);
            color: #E53935;
        }
        .controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .controls button {
            flex: 1;
            margin: 0;
        }
        .info {
            font-size: 12px;
            color: #999;
            margin-top: 12px;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="margin: 0 0 16px 0; font-size: 16px;">Awana Slideshow</h2>

        <div class="setting">
            <label for="pusherKey">Pusher App Key</label>
            <input type="text" id="pusherKey" placeholder="your-app-key">
        </div>

        <div class="setting">
            <label for="pusherCluster">Pusher Cluster</label>
            <input type="text" id="pusherCluster" placeholder="us2" value="us2">
        </div>

        <div class="setting">
            <label for="slideDuration">Slide Duration (seconds)</label>
            <input type="number" id="slideDuration" min="1" max="120" value="5">
        </div>

        <button id="startBtn" onclick="startPresentation()">Start Presentation</button>
        <button id="stopBtn" onclick="stopPresentation()" disabled>Stop</button>

        <div class="controls">
            <button id="prevBtn" onclick="previousSlide()" style="flex: 0.5;">← Prev</button>
            <button id="nextBtn" onclick="nextSlide()" style="flex: 0.5;">Next →</button>
        </div>

        <div id="status" class="status" style="display: none;"></div>

        <div class="info">
            ℹ️ Enter your Pusher credentials and click "Start" to begin. Slides will auto-advance every 5 seconds, and check-in overlays will appear as people join.
        </div>
    </div>

    <script src="taskpane.js"></script>
</body>
</html>
